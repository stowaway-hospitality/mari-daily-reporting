name: Tests

# Until this existed (2026-07-17) the repo had 196 tests and NOTHING ran them.
# Every guarantee in scripts/invoices/ -- the cost guard, the sanity bounds,
# the Alehouse check -- was enforced by nobody. A regression would have shipped
# green, because there was no green.
#
# This workflow is the only thing standing between a bad number and
# app.stowawaybar.com. Keep it fast so it never becomes the thing people skip.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Architecture guard (dashboard must stay modular)
        # The guardrail that makes drift impossible: 0 logic fns in index.html,
        # pnl.js pure, no duplicate defs, P&L model conserves (104 checks).
        run: python3 scripts/arch_guard.py

      - name: Schema guard (history CSVs must not regress)
        run: python3 scripts/schema_guard.py

      - name: Tests (pytest)
        run: python3 -m pytest

      - name: Tests (script-shaped)
        # test_mari_recovery.py is a real test that runs as a script and signals
        # via exit code. pytest cannot collect it (it sys.exits at import), so
        # run it the way it was built to run rather than rewrite a working test
        # to suit a runner. See pyproject.toml.
        #
        # scripts/test_pipeline.py is deliberately NOT here: it needs
        # .drive-staging CSVs that are not in the repo, so it cannot run on a
        # clean checkout. It is superseded by test_mari_recovery.py. See its
        # docstring.
        run: python3 scripts/test_mari_recovery.py

      - name: Closed-week leave split (rebuild_wages)
        run: python3 scripts/test_closed_week_leave.py

      - name: More script-shaped tests (wages / payroll / superannuation / auth gate)
        run: |
          set -e
          python3 scripts/test_wage_calibration.py
          python3 scripts/test_wage_open_week.py
          python3 scripts/test_super_actuals.py
          python3 scripts/test_corp_payroll.py
          python3 scripts/test_auth_gate.py

      - name: Pipeline integration battletest (invoice->cogs->recipes seams)
        # Unit tests prove each stage; this proves the SEAMS between them on the
        # real committed data — a recipe id that no longer matches a cost key, a
        # unit that drifted between costs.csv and ingredients.json, a forked pack
        # resolver. Every one has bitten this project once, silently.
        run: python3 scripts/test_pipeline_integration.py

      - name: Parser drift guard (per-supplier, corpus-gated)
        # Skips cleanly in CI (the real-invoice corpus is gitignored); runs for
        # real on the Mac via the healthcheck, where a supplier changing their
        # invoice format shows up as that parser's reconcile rate cratering.
        run: python3 scripts/test_parser_corpus.py

      - name: Invoice pipeline battletest (Dext-replacement guards)
        # The adversarial suite: dedup, credit-note refusal, statement detection,
        # the no-write push gate, AUTHORISED date guarantee, poller guards. Runs
        # OFFLINE (skips the live-Xero + corpus-only checks the CI box can't do)
        # but still enforces every guard that must never regress.
        run: python3 modules/invoices/tests/battletest_pipeline.py --offline

      - name: Every wage dollar reconciles to Xero
        run: python3 scripts/reconcile_wages.py

      - name: Dashboard model guards (node)
        # The sales dashboard's P&L math and render contract live in JS, so a
        # regression there fails no pytest — it ships as a wrong number on the
        # page. These three suites run the real dashboard modules under node:
        # test_pnl_model = P&L conservation (revenue - costs = profit, every
        # split reconciles), render = the DOM contract the tiles read, units =
        # the $/¢/% field discipline that caught the case-total-in-a-per-unit
        # field class of bug. Node 20 is already set up above.
        run: |
          set -e
          node scripts/test_pnl_model.mjs
          node scripts/test_dashboard_render.mjs
          node scripts/test_dashboard_units.mjs

      - name: Deterministic feeds must rebuild identically
        # data/costs.csv is derived from data/cogs_list.csv with no clock in the
        # loop, so it must reproduce exactly. A derived file that has stopped
        # reproducing is a fossil and every number built on it is quietly wrong.
        #
        # NOT checked here: data/ingredients.json. It is a 90-day window off
        # date.today(), so it changes with the calendar and cannot be diffed
        # against a committed copy -- the first version of this step did exactly
        # that and was a time bomb: green today, red on whatever Tuesday an
        # invoice crossed the 90-day line, with no code change. It is now
        # generated at build time and not committed at all.
        run: |
          set -e
          cp data/costs.csv /tmp/costs.before.csv
          python3 modules/recipes/pipeline/build_costs.py >/dev/null
          if ! diff -q /tmp/costs.before.csv data/costs.csv >/dev/null; then
            echo "::error::data/costs.csv is stale — rerun modules/recipes/pipeline/build_costs.py and commit"
            diff /tmp/costs.before.csv data/costs.csv | head -20
            exit 1
          fi
          echo "costs.csv reproduces from source"

      - name: Site must build and every reference must resolve
        # The repo layout and the deployed layout differ. A broken path fails
        # no test and no deploy — it shows up as a chef saying "the page is
        # blank". build_site.py resolves every href/src/import/fetch.
        run: python3 scripts/build_site.py

      - name: Guard rails still guard
        # Cheap, blunt, and aimed at the exact bugs that actually shipped this
        # week. If someone reintroduces max() in the cost guard, fail loudly
        # rather than wait for a wrong cost to reach a dish.
        run: |
          set -e
          if grep -rn "max(DRIFT_ABS\|max(SUSPECT_ABS" core/ modules/ scripts/ ; then
            echo "::error::cost guard is using max() (OR). It must be AND — see modules/invoices/resolve.py"
            exit 1
          fi
          python3 - <<'PY'
          import sys; sys.path.insert(0,'.')
          from decimal import Decimal
          from modules.invoices.resolve import is_suspect
          assert is_suspect(Decimal("212.44"), Decimal("184.94")), "Alehouse swap must be caught"
          assert not is_suspect(Decimal("1.47"), Decimal("1.8896")), "Sprite drift must pass"
          print("guards OK")
          PY
