name: Deploy dashboard to GitHub Pages

on:
  workflow_run:
    workflows: ["Daily Pull", "Mari Daily Pull", "Wages Backfill", "Rebuild Wages", "Roster Pull", "SPH from Email", "Hourly Pull"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'modules/recipes/**'   # the recipe builder app + its feed pipelines
      - 'core/**'              # the cost/identity engine the feeds build on
      - 'data/recipes/**'      # saved recipes feed the sub-recipe index
      - 'data/**'              # the numbers themselves. WITHOUT THIS, any commit that
                               # touches only data/ never deploys: the feed is correct in
                               # git and stale on screen, with nothing anywhere saying so.
                               # Bit the Uber pull (the one daily writer that is a Cowork
                               # task, not a workflow, so it cannot trigger the
                               # workflow_run path below either) and — worse — bit the
                               # health snapshot itself: alert_check.py commits
                               # data/system_health.json when a check CHANGES STATUS, so a
                               # feed could go down, publish 'down' to main, and the app
                               # would keep serving the last 'ok' it happened to deploy.
      - 'scripts/build_site.py' # the builder itself (cache-bust, link-check)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read        # the gate below reads the Tests run for this commit

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ the gate
  # Nothing reaches app.stowawaybar.com while Tests is red.
  #
  # Until 2026-08-16 this workflow never looked at the test suite: it ran
  # arch_guard and the link-check, then shipped. Measured on that day: 4 red
  # builds on main and 48 of 48 deploys succeeded anyway — including one sitting
  # live while a duplicate-recipe test was failing, i.e. while the cost book was
  # knowingly ambiguous.
  #
  # This does NOT re-run the suite (it is minutes long and already ran on the
  # push). It asks GitHub what Tests concluded for THIS commit, waits if it is
  # still going, and refuses to build otherwise.
  gate:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'   # manual dispatch is the escape hatch
    steps:
      - name: Tests must be green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Up to ~10 minutes: the push that triggered Tests and the event that
          # triggered this deploy race, so "not started yet" is normal.
          for i in $(seq 1 40); do
            run=$(gh api "repos/$REPO/actions/workflows/tests.yml/runs?head_sha=$SHA&per_page=1" --jq '"\(.workflow_runs[0].status // "none") \(.workflow_runs[0].conclusion // "-")"' 2>/dev/null || echo "none -")
            status=${run%% *}; concl=${run##* }
            # jq prints "null" for a missing run, not the empty string, so the
            # no-run branch below must match it. It did not on the night this
            # shipped: every workflow_run deploy sat in this loop for ten
            # minutes and failed, and the site fell eleven hours behind its own
            # data while the repo itself was correct.
            case "$status" in null|"") status=none;; esac
            if [ "$status" = "completed" ]; then
              if [ "$concl" = "success" ]; then
                echo "Tests passed for $SHA — deploying."; exit 0
              fi
              echo "::error::Tests concluded '$concl' for $SHA. Not deploying a build whose tests are not green."
              exit 1
            fi
            if [ "$status" = "none" ] && [ "$i" -gt 3 ]; then
              # No Tests run for this SHA at all. That is EXPECTED for the
              # heartbeat commits tests.yml deliberately ignores (health
              # snapshot, logs, ingest ledger), so fall back to the last known
              # state of main: publishing fresh data from a red tree is still
              # publishing from a red tree.
              last=$(gh api "repos/$REPO/actions/workflows/tests.yml/runs?branch=main&status=completed&per_page=1"                        --jq '.workflow_runs[0].conclusion' 2>/dev/null || echo unknown)
              if [ "$last" = "success" ]; then
                echo "No Tests run for $SHA (ignored path); main was last green — deploying."; exit 0
              fi
              echo "::error::No Tests run for $SHA and main was last '$last'. Not deploying."
              exit 1
            fi
            echo "Tests status=$status conclusion=$concl — waiting (${i}/40)"
            sleep 15
          done
          echo "::error::Timed out waiting for Tests on $SHA."
          exit 1

  build:
    runs-on: ubuntu-latest
    needs: gate
    # gate is SKIPPED on workflow_dispatch (the deliberate escape hatch), and a
    # skipped dependency would otherwise skip this job too — turning the manual
    # override into "nothing happens", which is the worst kind of override.
    if: ${{ always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        # build_site.py now generates the recipe feeds, which import the cost
        # engine (PyYAML). Without this the build fails with ModuleNotFoundError
        # even though it works locally. Same deps as the test job.
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Architecture guard (block logic-in-HTML + verify P&L model)
        # Fails the DEPLOY if the dashboard drifts from its module structure:
        # no business logic in index.html, pnl.js pure, model conserves. A
        # drifted dashboard never reaches app.stowawaybar.com.
        run: python3 scripts/arch_guard.py
      - name: Build _site
        # ONE definition of the site layout, shared with local preview:
        #   python3 scripts/build_site.py --serve
        # If it works locally it works here, because it is the same code.
        # Also fails the deploy if any page references a file that isn't built.
        run: python3 scripts/build_site.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Needed for the same reason as build's if(), and missing it cost a real
    # dispatch: a job's implicit condition is success() over ALL ancestors, so
    # the SKIPPED gate propagated down here and deploy was skipped even though
    # build succeeded. Verified on run 31929152913 — build ok, nothing published.
    # An override that builds and publishes nothing is worse than no override.
    if: ${{ always() && needs.build.result == 'success' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
