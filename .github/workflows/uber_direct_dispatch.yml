name: Uber Direct fee ingest [RETIRED]

# RETIRED 2026-08-10. Kept, not deleted (no permanent deletion), but its
# automatic trigger is REMOVED so it cannot fire on its own.
#
# It was fired by the Pipedream "Mari Insights to GitHub" workflow when Uber's
# daily Direct invoice email arrived: Pipedream parsed date + fee and POSTed a
# repository_dispatch (uber-direct-arrived), and this job upserted the fee.
# Pipedream's free tier ran out 2026-07-24 and the feed sat dead for 22 days.
# Uber Direct now comes from direct.uber.com via the uber-eats-daily-fees task.
#
# WHY the trigger had to go rather than just being left inert: this job keys the
# fee by the INVOICE date from the email. The feed is now keyed by DELIVERY date,
# because that is what lines the cost up with the sales it belongs to, and the
# two are NOT the same day — the 2026-07-24 deliveries were billed partly on the
# 24th and partly on the 27th. If anything ever re-fired this dispatch it would
# quietly write rows on the wrong basis into a feed that now reconciles against
# Uber's own invoices, and break that reconciliation. workflow_dispatch is left
# so the job can still be driven by hand if a historical day ever needs it.
concurrency:
  group: uber-direct-ingest
  cancel-in-progress: false

on:
  # repository_dispatch trigger removed 2026-08-10 — see the note above.
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Activity date (YYYY-MM-DD)'
        required: true
      fee:
        description: 'Uber Direct fee inc GST, e.g. 15.23'
        required: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_DATE: ${{ github.event.client_payload.target_date || inputs.target_date }}
      FEE: ${{ github.event.client_payload.fee || inputs.fee }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upsert uber_direct_daily.csv
        run: python3 scripts/uber_direct_upsert.py "$TARGET_DATE" "$FEE"

      - name: Commit + push
        run: |
          git config user.name "uber-direct-bot"
          git config user.email "bot@stowawaybar.com"
          git add data/uber_direct_daily.csv
          git diff --quiet --staged || git commit -m "Uber Direct fee ${TARGET_DATE} A\$${FEE} (email->Pipedream)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep $((i*5)); done
