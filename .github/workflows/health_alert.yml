name: Monitor & auto-heal

# Always-on monitor + AUTO-REMEDIATION. Every 3 hours it re-runs a transiently
# failed pipeline job (once) and re-triggers the sales ingest if data is late —
# silently — and only pings a human for what a human must handle. Actions need
# GH_DISPATCH_PAT (repo scope). Escalation channel is inert until a secret is set:
#   ALERT_EMAIL    — comma-separated recipients (sends via the existing Gmail
#                    ingest account: GMAIL_ADDRESS + GMAIL_APP_PASSWORD), OR
#   ALERT_WEBHOOK  — a Slack/Teams incoming-webhook URL.
# See scripts/notify.py and scripts/alert_check.py.

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force_health:
        description: 'Also alert if health is down (ignore the daily throttle)'
        type: boolean
        default: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Monitor, auto-remediate safe issues, escalate the rest
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_PAT }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_FORCE_HEALTH: ${{ github.event.inputs.force_health == 'true' && '1' || '' }}
        run: python3 scripts/alert_check.py
