name: Par Model

# Weekly par recommendation rebuild for Stowaway + Harry Gatos.
#
# Runs Sunday 08:00 Australia/Sydney (Sat 22:00 UTC) — after the week's sales
# have landed in data/products_weekly.csv but before the Sunday ordering cycle.
#
# It ONLY computes recommendations and commits the JSON feeds + the override
# ledger back to the repo. It NEVER uploads pars to Lightspeed — pushing pars to
# the Purchase module stays a deliberate, human, in-app action.
#
# The build FAILS (non-zero) if the coverage gate trips (a live Classic/Signature
# cocktail with no recipe). Fail toward review.
#
# v3 (2026-08-09) also writes data/par_shrinkage.json — the measured stock loss
# per SKU from data/stock_counts/ — and every run prints the CHRISTMAS 2026
# exposure in its SANITY block. That gap (last delivery Wed 23 Dec, next
# realistic delivery Wed 6 Jan = 14 days, ~2.1x a normal cycle) needs supplier
# shutdown dates collected in late NOVEMBER. A one-off dated cron is not
# expressible here without a workflow that fires and no-ops weekly for a year,
# so the reminder lives in the build output plus data/_par_review/christmas_2026.md.

on:
  schedule:
    # Sat 20:00 UTC = Sun 06:00 Australia/Sydney. Deliberately BEFORE the 7am
    # Sunday review task: the daily data pipeline lands ~6am, this computes on
    # it, and the review task at 7am reads freshly-committed recommendations
    # rather than last week's.
    - cron: '0 20 * * 6'
  workflow_dispatch:

concurrency:
  group: par-model
  cancel-in-progress: false

jobs:
  par:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install (pinned)
        run: pip install -r requirements.txt

      - name: Build par recommendations (coverage gate enforced)
        run: python3 scripts/build_par_model.py

      - name: Flag / diff report + log manual raises
        run: python3 scripts/par_flag_report.py

      - name: Commit feeds
        run: |
          git config user.name "Par Model"
          git config user.email "hello@stowawaybar.com"
          git add data/par_recommendations_stowaway.json \
                  data/par_recommendations_harry_gatos.json \
                  data/par_flags_stowaway.json \
                  data/par_flags_harry_gatos.json \
                  data/par_shrinkage.json \
                  data/par_overrides.json
          git diff --quiet --staged || git commit -m "Par model: weekly recommendations + flags refresh"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep $((i*5)); done
