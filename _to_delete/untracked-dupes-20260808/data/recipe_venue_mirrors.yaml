# Where one venue deliberately serves another venue's recipe.
#
# WHY THIS FILE EXISTS
# --------------------
# data/lightspeed_recipes.json is keyed by PRODUCT NAME with no venue, because the
# Lightspeed Produce scrape has no venue dimension. So when two venues both have a
# recipe called "Classic Margarita", only one can win.
#
# That is not merely a merge conflict — it is a decision about what we serve, and
# it belongs in the repo rather than in a scrape. So we do NOT edit Produce.
# Produce is the legacy source we are migrating off; writing there would make it
# the master again and the edit would be invisible to git.
#
# Zak, 2026-08-06: "dont write anything into produce. we're doing everything
# ourselves on the repo now" and "just mirror the classic cocktail recipes over to
# hg as they are the same specs".
#
# HOW IT IS APPLIED
# -----------------
# scripts/merge_venue_scrape.py refuses to import a venue's own version of a
# mirrored dish, so the source venue's recipe stands. Against today's data this is
# a no-op — the name-keyed book already resolves HG to Stowaway's recipe — and
# that is the point: the behaviour is now DELIBERATE and a future re-scrape cannot
# silently reintroduce a broken recipe.
#
# THE REAL FIX, STILL TO COME
# ---------------------------
# Mirrors express "same spec". They cannot express "different spec per venue",
# which is what the exceptions at the bottom of this file need. That requires
# venue-keyed recipes and stock — see HANDOFF_20260805_pm.md.

harry_gatos:

  # --- same spec, Stowaway's version is the fuller/correct one -----------------
  # HG's Produce entries were incomplete: its Classic Margarita had tequila and
  # triple sec but no lime, sugar or salt; its "Lychee Martini" listed Massenez
  # TRIPLE SEC where Stowaway lists LYCHEE (the wrong product picked from the
  # dropdown); its Espresso Martini dropped the rum, vanilla and coffee beans.
  Classic Margarita: stowaway
  Espresso Martini: stowaway
  Lychee Martini: stowaway
  Negroni: stowaway
  Nitro Sorbet Espresso: stowaway

  # --- classic cocktails: identical specs, only the product NAMING differs -----
  # e.g. "White Light Vodka [20L]" vs "White Light Pure Vodka [20L]", "Kahlua [1L]"
  # vs "Kahlúa Coffee Liqueur [Bottle]", "Stow Vermouth Blend" vs "Vermouth Blend".
  # Same liquid, same pour. One spec, maintained once.
  Amarretto Sour: stowaway
  Caprioska: stowaway
  Four Pillars Bloody Shiraz Gin: stowaway
  Kahlúa Coffee Liqueur: stowaway
  Manhattan - Sweet: stowaway
  Mojito: stowaway
  Old Fashioned: stowaway
  Tanqueray 10 Gin: stowaway
  Tom Collins: stowaway

  # --- single-spirit pours and wines by the glass: same spec -------------------
  Appleton Rum [House]: stowaway
  Campari: stowaway
  Fernet Branca: stowaway
  Hendrick's Gin: stowaway
  Jameson Irish Whiskey: stowaway
  Lost Explorer Espadín Mezcal: stowaway
  Mancino Sakura Vermouth: stowaway
  Oscar.697 Rosso Vermouth: stowaway
  Ottelia Cab Sav - Large: stowaway
  Ottelia Cab Sav - Regular: stowaway
  Padrillos Malbec - Large: stowaway
  Padrillos Malbec - Regular: stowaway
  Plantation 3 Stars White Rum: stowaway
  St. Germain Elderflower Liqueur: stowaway
  White Light Pure Vodka [House]: stowaway
  Wolf Lane Navy Gin: stowaway

# NOT MIRRORED — these five genuinely differ, and mirroring them would cost Harry
# Gatos off liquid it does not pour:
#
#   Aperol Spritz      HG pours Palloncino Prosecco, Stowaway Version Two Sparkling
#   Campari Spritz     same
#   Limoncello Spritz  same
#   Pornstar Martini   same
#   Daiquiri           HG uses Bacardi Blanca, Stowaway uses Havana 3yr
#
# They keep costing off Stowaway's recipe today only because the book is keyed by
# name. That is wrong, and it is the case that justifies venue-keyed recipes.
