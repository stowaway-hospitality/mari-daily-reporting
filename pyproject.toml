[tool.pytest.ini_options]
# WHY testpaths IS PINNED HERE
#
# Bare `pytest` from the repo root CRASHES:
#
#     INTERNALERROR>  sys.exit(1 if FAIL else 0)
#     no tests ran
#
# scripts/test_pipeline.py and scripts/test_mari_recovery.py match test_*.py,
# so pytest IMPORTS them during collection -- and they are standalone scripts
# that call sys.exit() at module level. Collection dies before a single test
# runs.
#
# They are good tests (test_mari_recovery.py is the adversarial suite for the
# Mari recovery + narrowed-export tripwire). They are simply script-shaped, not
# pytest-shaped. So: point pytest at the pytest tests, and let CI run the two
# scripts as scripts, checking their exit code. Do not rewrite working tests to
# please a runner.
#
# THE TRAP THIS SETS, AND WHERE TO PUT A NEW TEST
#
# A pytest-shaped test written under scripts/ is never run. Not by `pytest`,
# because of the line below; and not by CI, because CI names the script-shaped
# ones one at a time. It passes locally when you point pytest at it and then
# silently guards nothing. scripts/test_our_costs_book.py sat like that — 6 tests
# on the P&L's use of the cost book, green on demand, never once run by CI.
#
# So: a test with `def test_*` and no sys.exit belongs under modules/, whatever
# it covers. It can still import from scripts/. Only genuinely script-shaped
# tests (the ones that sys.exit at module level) go in scripts/, and each of
# those needs its own CI line.
testpaths = ["modules", "tests"]
pythonpath = ["."]   # repo root: core/ and modules/ are packages
addopts = "-q --strict-markers"
