- id: "lightspeed:22488995"
  product_name: "Avocado [Tray]"
  venue: "stowaway"
  checked_invoice: "INB00101295"
  checked_on: "2026-05-01"
  by: "Claude"
  by_email: "hello@stowawaybar.com"
  verdict: >-
    adjudicated: both records are the same product at different granularity,
    neither is wrong. FFT code AH20T is a 20-count Hass tray ($22.00-$33.00, 24
    invoices); Select Fresh AVOE is loose fruit at $3.10 ea. $26.40/20 = $1.32 a
    fruit against $3.10 retail - an ordinary bulk spread. Corroborated two ways:
    BO DefaultSize is 5000 g (20 x 250 g), and Guacamole [4kg] consumes exactly
    one tray per 4 kg batch, i.e. ~80% flesh yield off a 5 kg tray. BASIS
