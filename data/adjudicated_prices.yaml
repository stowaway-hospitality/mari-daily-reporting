# Price questions that have been ANSWERED, so the queue stops asking them.
#
# WHY THIS FILE EXISTS SEPARATELY FROM data/product_map.csv
# --------------------------------------------------------
# _adjudicated_ids() used to read product_map.csv alone, and the Havana Club row
# is why: somebody checked an invoice, wrote down which side was right, and the
# flag retired. That works when the answer IS a bridge — Havana Club has a real
# ILG code and a real price to import.
#
# It does not work when the answer is "our number was already right", or "both
# records are right and here is the ratio between them". Those have no supplier
# code to key on, and product_map.csv is contractually keyed by (supplier,
# supplier_code): purchasable_id() RAISES on a blank code rather than guessing,
# on purpose — "There is no natural key, so there is no identity. Do NOT fall
# back to the description." Ten adjudication rows with blank codes were written
# into it and three separate tests went red on that ValueError immediately. The
# refusal was right and the rows were in the wrong file.
#
# So: bridges go in product_map.csv. Verdicts go here. A verdict retires a flag
# without importing a price.
#
# Each entry must say what was checked and what it proved, in enough detail that
# the next person can DISAGREE with it. "Checked, fine" is not an adjudication.

