    costing flesh grams against it would under-cost by the peel yield. That
    yield is a kitchen weighing.

- id: "lightspeed:20564869"
  product_name: "Lemon"
  venue: "stowaway"
  checked_invoice: "3115073"
  checked_on: "2026-08-12"
  by: "Claude"
  by_email: "hello@stowawaybar.com"
  verdict: >-
    adjudicated: same product, two granularities. BO's own DefaultSize says one
    lemon is 200 g, so the per-kg feed and the per-each record are the same
    fruit: Select Fresh LEMK $3.20/kg (3115073) x 0.2 kg = $0.64 a lemon, and
    Select Fresh LEME invoices loose lemons at $0.50 ea directly. RESIDUAL,
    RECORDED NOT BURIED: the ls-recipe-seed rate is $0.375/ml, ~41% below the
    invoice-derived $0.64, and its 'ml' label is wrong - the 5 recipe lines on
    it are counts of fruit (0.08 = a wedge, 2 = two lemons), not millilitres.
    NOT re-based: reading 0.08 as 0.08 g would collapse the line to nothing,
    which is the Rosemary Salted Fries trap. Fix is the unit in Produce, then a
    bridge. ~$0.90 of recipe cost rides on it.

- id: "lightspeed:22995343"
  product_name: "Herb Chives [Market]"
  venue: "stowaway"
  checked_invoice: "INB00113232"
  checked_on: "2026-07-30"
  by: "Claude"
  by_email: "hello@stowawaybar.com"
  verdict: >-
    adjudicated: BOTH RECORDS ARE RIGHT — they are two different bunches, not
    two prices. FFT bill chives under HCBCH (retail bunch, $1.49-$2.75) and HCMB
    (market bunch, $8.91-$15.40). Across 17 paired invoices the ratio has a
    median of EXACTLY 6.00x, eight consecutive same-day pairs to the cent. I
    read that as a 6-pack and was wrong: pack_overrides line 185 already carries
    Zak's 2026-07-26 confirmation that FFT market herbs are sold BY THE BUNCH —
    a market bunch is one bunch ~6x the size, which is why it costs 6x. A ratio
    is not evidence of a pack count when a size difference explains it equally
    well. The 6 ea override I shipped also landed on the wrong observation
    (recipe-bridge-seed $1.65/ea, not the $9.90 pack) and invented $0.275
    chives; backed out, reasoning kept in pack_overrides. REMAINING WORK IS THE
    SCALES: weigh one bunch so the g-denominated lines convert off a real weight
    (feed-line-unit-chives).

