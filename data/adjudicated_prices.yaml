- id: "lightspeed:20445811"
  product_name: "Bombay Dry [House]"
  venue: "stowaway"
  checked_invoice: "03744947"
  checked_on: "2026-08-11"
  by: "Claude"
  by_email: "hello@stowawaybar.com"
  verdict: >-
    OURS IS RIGHT, and it is not a close call. Our $0.072145/ml is fed by NINE real
    ILG invoices between 2026-03-26 and 2026-08-11, every one of them in the band
    $0.070179-$0.073931/ml, and the independent Back Office seed agrees at
    $0.073943. Lightspeed's recipe costing implies $2.118667/ml, which prices a
    700 ml bottle of Bombay Dry at $1,483. Nine invoices and a seed against a
    number no bottle of gin has ever cost. This is really a UNIT argument rather
    than a price one - the same class the detector already excludes above 50x - and
    it lands at 29.37x, just under that line. Left in the detector rather than
    widening the 50x rule: the rule is calibrated and one straggler is not evidence
    to move it.

