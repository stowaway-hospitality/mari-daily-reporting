# ESTIMATED batch yields for preps whose Produce recipe carries no yield.
#
# A prep without a yield cannot be costed per gram/ml, so any dish using it
# falls back to a frozen scrape number and shows as '(imported)' in the
# builder. These estimates unblock that. They are DERIVED, not measured:
# the batch weighs what went into it, less an allowance where the method
# clearly drives off water (gravy/caramel 0.75, sauces 0.90), plus the
# reverse for syrups, where dissolved sugar ADDS volume.
#
# Replace any line with a measured yield when someone next makes the batch —
# the cost per unit moves in direct proportion, so this is the one number
# worth checking on the floor.
Black Beans Prep:
  basis: sum of ingredients x1.0
  yield_qty: 303
  yield_unit: ml
