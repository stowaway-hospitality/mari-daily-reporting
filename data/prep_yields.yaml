Cooked Beef Brisket [1Kg]:
  basis: 'ESTIMATED, not measured — pending the kitchen weighing this batch (raw in -> cooked out).


    Produce''s ''Expected yield'' field holds 10,500 g, which is the RAW WEIGHT and not a

    yield: the batch puts in 10,000 g of brisket, and meat cannot leave a braise heavier

    than it went in. Read literally it made cooked brisket cost $13.93/kg, against

    $14.00/kg for the RAW meat on the B&E invoice — i.e. cooking it for nine hours was

    free. That under-states cost, which flatters GP, so it does not alarm.


    60% is the conservative end of the 55-65% published retention band for braised

    brisket (30-45% loss). It is independently corroborated: Lightspeed''s own recipe

    cost for the same cooked brisket, seeded as ''Pizza Beef Brisket [Kg]'' at $25.00/kg

    (cogs_list ls-recipe-seed, median of 3), implies a 58.5% yield. Two unrelated

    routes landing within 1.5 points of each other is the reason to accept 60% until

    somebody weighs it.


    10,000 g raw x 60% = 6,000 g cooked -> $24.38/kg. REPLACE THIS WITH A WEIGHING.'
  yield_qty: 6000
  yield_unit: g
