# Estimated batch yields. Where a line's literal quantity is a PACK COUNT ("1"
# meaning one 1kg tub of yoghurt), the weight is taken from what the line COSTS
# divided by our per-gram rate — the cost is invoice-fed, so it is the reliable
# side. Reading those literally gave Tandoori Sauce a 216g yield when its
# ingredients weigh ~1.1kg, which then reported the batch at $60.56/kg.
Black Beans Prep:
  basis: sum of ingredients x1, weights taken from the invoice-implied amounts (a
    "1" that is really a 1kg tub)
  yield_qty: 7125
  yield_unit: ml
