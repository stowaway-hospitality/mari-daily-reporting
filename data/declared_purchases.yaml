  # COFFEE BEANS — Zak (2026-08-20): "just 1kg of whatever brand from IGA. we
  # wont get an invoice for them, just look up a typical price and hardcode
  # it." IGA Shop Online, checked 2026-08-20: Vittoria Espresso 1kg $39-59,
  # Lavazza Qualita Oro 1kg $43.50-61.53, Vittoria Mountain Grown $52.99-65.73.
  # $45 is the middle of that band. Coffee beans are GST-free food, so the
  # shelf price IS the ex price.

  - supplier: "IGA"
    supplier_code: "COFFEE1KG"
    description: "Coffee Beans 1kg (retail, brand varies)"
    # Coffee beans are GST-FREE food, so the $45 shelf price is the landed
    # price. The builder multiplies price_ex_gst by 1.1 to get the incl figure
    # the ledger holds — so this field carries 45/1.1, and the ledger lands on
    # the true $45.00/kg. price_ex_gst is a field name, not a fact, here.
    price_ex_gst: 40.9091
    pack_qty: 1000
    pack_unit: g
    venue: stowaway
    purchased_on: 2026-08-20
    evidence: "IGA Shop Online 2026-08-20: 1kg beans $39-66 across Vittoria/Lavazza lines; $45 mid-band; GST-free so ledger-incl = $45.00"

