  - supplier: "Sigurd Wines"
    supplier_code: "SIGRED23"
    description: "2023 Sigurd Red ($21 LUC)"
    price_ex_gst: 21.00
    pack_qty: 750
    pack_unit: ml
    venue: stowaway
    purchased_on: 2026-07-21
    evidence: "Sigurd Wines INV-11224 (and 11148/11175, identical): LUC $21 printed on the line; WET arithmetic closes exactly"

