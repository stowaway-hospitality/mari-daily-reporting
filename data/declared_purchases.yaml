# THINGS WE BUY WHOSE INVOICES NEVER REACH THE PIPELINE.
#
# A hand-entered purchase, in the same shape a parsed invoice line takes, for a
# supplier the mailbox does not deliver. It behaves exactly like an invoice row:
# it is dated, it carries its evidence, and A REAL INVOICE SUPERSEDES IT the day
# one arrives, because the newer observation wins the as-of lookup.
#
# WHY THIS EXISTS. Three suppliers are missing from the ledger entirely — CUB
# (all postmix), Mr Iceman (clear ice), and Harry Gatos' ILG account. Until
# today the cost book's only options for those were a Back Office figure
# somebody typed, or nothing. Both produce a number with no working behind it:
# Pepsi Max Glass was $1.31 a glass and nobody could say why.
#
# `purchased_on`, NOT `on`. YAML 1.1 reads a bare `on:` as the BOOLEAN TRUE, so
# the key never arrives as a string and every row came through undated — which
# in a cost book means "no observation date", i.e. invisible. It cost twenty
# minutes and it would have cost a lot more if the rows had loaded and simply
# sorted wrong.
#
# THIS IS NOT A PLACE TO PUT A GUESS. Every entry names where the price came
# from, precisely enough that the next person can check it. A price nobody can
# check is what this file exists to replace.

