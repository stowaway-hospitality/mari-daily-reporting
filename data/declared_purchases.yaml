  # Zak's CUB cart, 2026-08-19 (online.cub.com.au/sabmStore/en/cart), screenshot
  # in the session log. Prices are EX GST and ex freight, as that cart states;
  # they are recorded here INCL GST (x1.1) because that is what cogs_list holds.
  #
  # Zak, 2026-08-19: "theres 1 bib per order" — so the cart's "Case" UOM is one
  # BIB, and the pack quantity is the BIB's own volume.
  #
  # The consistency check that says this is read right: $272.99/10L and
  # $409.49/15L are both exactly $27.299 per litre of syrup. Two pack sizes,
  # one syrup price. A misread of the case would break that.

  - supplier: "CUB"
    supplier_code: "PEPSIMAX10L"
    description: "Pepsi Max Postmix 10L BIB"
