  # SIGURD WINES PTY LTD — a standing order: INV-11148 (5 Jun), INV-11175
  # (29 Jun), INV-11224 (21 Jul), each 12 x "2023 Sigurd Red ($21 LUC)" at
  # $277.22. The invoice names its own landed cost and the arithmetic closes
  # exactly: (17.9083 unit incl + 62.32 WET / 12) / 1.1 = $21.00 ex. Costing
