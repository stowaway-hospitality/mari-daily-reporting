# What the cost book still needs from a human — the DECLARED half.
#
# scripts/build_cost_book_flags.py writes data/cost_book_flags.json, which the
# recipe book renders on the Flags tab of /recipes/. Almost everything on that panel is
# DERIVED from data/ at build time — the dishes with no costed recipe, the stock
# items held twice at two prices, the seed rows an invoice has since contradicted,
# the invoice lines no sanity bound admits. Those are not listed here and must
# never be: a hand-kept list of findings goes stale the day someone fixes one,
# and a stale work queue is worse than none because it teaches people to skim.
#
# THIS FILE HOLDS ONLY WHAT DATA CANNOT KNOW:
#
#   * a QUESTION for a human (what does a kilo of raw lamb plate at?). The
#     dollars attached to it are still derived — see cook_loss below.
#   * a DECISION that has no right answer until someone makes it.
#   * a PERMANENT EXEMPTION: a product that can never be costed, so it must stop
#     appearing as work.
#
# If you find yourself adding a finding here, the finding belongs in the builder.
# ---------------------------------------------------------------------------

# COOK LOSS IS NOT MODELLED ANYWHERE IN THIS SYSTEM.
#
# COGS_ARCHITECTURE.md named it in the "hard parts" on day one — "a 5kg brisket
# does not yield 5kg of portions. Recipes need a yield factor or every food cost
# reads low" — and it is still true. Every recipe below prices a PLATED or PORTIONED
# weight at the RAW purchase rate, so every one of them under-costs, and
# under-costing is the direction that flatters GP.
#
# 0.65 IS NOT A MEASUREMENT AND IS NEVER APPLIED TO A COST. It is here to SIZE
# the question — to say whether the answer is worth a chef's afternoon or not.
# 65% is the middle of the ordinary published range for roasted whole muscle
# (bone-in and rolled joints run roughly 60-75% after cooking and resting). The
# moment Zak weighs one, the real number goes into the recipe and this whole
# block should be deleted rather than corrected.
cook_loss:
  assumed_yield: 0.65
  subjects:
    # --- roasts: the recipe's 220 g is what lands on the plate ----------------
    # Zak has confirmed the lamb figure is PLATED. The other three roasts are the
    # same dish with the protein swapped — identical carrot / broccolini / potato
    # / Yorkshire / gravy lines, identical $30.00 price — so they carry the same
    # question, and it has to be asked once per protein because they do not
    # shrink at the same rate.
    # CLOSED 2026-08-15 — Zak weighed one: "raw lamb 2.7kg was 2.3kg cooked for
    # roast". 2.3 / 2.7 = 85.19%, and it is APPLIED, not recorded: the measurement
    # lives in data/cook_yields.yaml and scales the plated 220 g to the 258.3 g of
    # raw leg behind it. Lamb Roast $6.6188 -> $7.3649, GP 75.7% -> 73.0%.
    #
    # AND IT MOVES THE OTHER TWO QUESTIONS, WITHOUT ANSWERING THEM. This block
    # sizes cook loss with assumed_yield 0.65, so yield-lamb-roast was advertised
    # at $2,666/yr. The real lamb figure is 85.2% — the loss is less than a third
    # of what 65% implied. Nobody should read the pork and beef dollar figures
    # below as facts; they are the same assumption, and the one protein anybody
    # has actually weighed came in far better than it. They still need weighing,
    # because the three do not shrink at the same rate — that is exactly why this
    # is asked once per protein — but the prize is smaller than it looks.
    - id: yield-pork-roast
      ref: "lightspeed:22992677"
      in_recipe: "Pork Roast"
      subject: "Pork Roast — pork leg"
      question: "What does 1 kg of raw pork leg plate at?"
      evidence: "same plate as Lamb Roast with the protein swapped; 220 g plated"
      owner: "Kitchen — weigh one joint in, one joint out"
    - id: yield-beef-roast
      ref: "lightspeed:23007639"
      in_recipe: "Beef Roast"
      subject: "Beef Roast — brisket, YG point end"
      question: "What does 1 kg of raw point-end brisket plate at?"
      evidence: "same plate as Lamb Roast with the protein swapped; 220 g plated"
      owner: "Kitchen — weigh one joint in, one joint out"
    # CLOSED 2026-08-09 — Zak: "the chicken is definitely half a chicken on a
    # plate". The whole purchased half-bird is served, so nothing is lost between
    # buying and plating and there is no yield to apply: the raw half-bird IS the
    # portion. (It still shrinks in the oven; that costs nothing, because we do
    # not buy the water.) This differs from the roasts above, where a joint is
    # cooked and then CARVED into 220 g plates — there the loss is real and the
    # question stands. Do not re-add without a new reason.

    # --- batches costed across their RAW input weight -------------------------
    # Worse than the roasts, because the loss is smeared over every dish drawing
    # on the batch instead of sitting in one recipe. The batch cost is divided by
    # the weight that went IN, so every gram taken out is priced as though nothing
    # evaporated.
    #
    # UPDATE 2026-08-10: brisket and achiote chicken now carry ESTIMATED cook
    # yields (data/prep_yields.yaml, data/recipe_yields.yaml cook_yield_estimates)
    # so neither is priced at the raw rate any more. They stay flagged because an
    # estimate is not a measurement and these two are the largest — the burrito
    # and taco GPs move when somebody weighs a batch. The three roasts below have
    # no estimate at all.
    - id: yield-cooked-beef-brisket
      prep: "Cooked Beef Brisket [1Kg]"
      subject: "Cooked Beef Brisket [1Kg] — 10 kg raw brisket plus aromatics"
      question: "What does the 10 kg raw brisket batch weigh once cooked and rested?"
      evidence: "ESTIMATED 2026-08-10 at 60% retention (6,000 g from 10,000 g raw)
        pending a weighing — before that the batch was spread over Produce's
        'Expected yield' of 10,500 g, which is the RAW weight and made COOKED
        brisket $13.93/kg against $14.00/kg for the RAW meat on the B&E invoice.
        60% is the conservative end of the 55-65% published band for braised
        brisket and is corroborated by Lightspeed's own cost for the same cooked
        meat implying 58.5%. Now $24.38/kg across all 14 products that use it."
      owner: "Kitchen — weigh the tray after the cook, and replace the estimate"
    - id: yield-chashu-pork-belly
      prep: "Chashu Pork Belly Prep"
      subject: "Chashu Pork Belly Prep [HG] — 5 kg raw pork belly plus braising liquid"
      question: "What does the 5 kg raw pork belly batch weigh once braised and rested?"
      evidence: "FOUND 2026-08-13 when Harry Gatos' Produce was finally readable.
        The 'Expected yield' field holds 5,000 g against exactly 5,000 g of raw
        pork belly — the third instance of the raw weight recorded as the yield,
        after Cooked Beef Brisket and Achiote Chicken. Braised pork belly does not
        leave the pan weighing what it went in at. Checked all 13 harvested HG
        preps: this is the ONLY one with the signature; the other twelve are
        legitimately above 1x because liquid is added (Tonkotsu Broth 2.5x, Tofu
        Marination 4.0x, Katsu Curry Sauce 15x). NO LIVE IMPACT TODAY — nothing
        costs off it yet, because the ramen dishes that would are among the
        uncosted 41. It is recorded now so it is right when they are written."
      owner: "Kitchen — weigh the tray after the braise"
    - id: yield-achiote-chicken
      prep: "Achiote Chicken [15Kg]"
      subject: "Achiote Chicken [15Kg] — 15 kg raw thigh plus marinade"
      question: "What does the 15 kg raw thigh batch weigh once cooked?"
      evidence: "ESTIMATED 2026-08-10 at 70% retention (10,500 g from 15,000 g raw)
        pending a weighing — Produce's 'Expected yield' held 15,000 g, which is
        exactly the raw thigh weight and exactly the number in the recipe's own
        name. 70% is the conservative end of the published 70-75% band for
        boneless skinless thigh. Now $24.92/kg."
      owner: "Kitchen — weigh the tray after the cook, and replace the estimate"

# PRODUCTS THAT CAN NEVER BE COSTED, so they must stop reading as work.
#
# The coverage rule is right to notice them — they are revenue with no recipe —
# but no recipe will ever exist, because there is no dish behind the SKU. Left in
# the queue they sit near the top by revenue and make the list look unfinishable.
#
# A pattern here is a PERMANENT statement, not a "not yet". Anything that could
# one day have a recipe does not belong.
exempt:
  # DISCONTINUED — Zak, 2026-08-17.
  - match: "^4 pines kolsch"
    reason: "discontinued (Zak, 2026-08-17). No invoice will price it again;
      delist it in Back Office rather than back-fill a cost."
  - match: "^barebones clear ice"
    reason: "discontinued (Zak, 2026-08-17). We buy clear ice blocks from MR
      ICEMAN now — and Mr Iceman does not appear in data/cogs_list.csv at all,
      so that supplier's invoices are not being ingested. Delisting this closes
      the flag; getting Mr Iceman into the mailbox pipeline is the real fix and
      is a separate job."
  # DISCONTINUED — Zak, 2026-08-16. Both still ring on the POS and neither can
  # be bought, so there is no cost to find and never will be. The fix is
  # delisting them in Back Office, not back-filling a price for something we do
  # not stock; carrying them as "sells but costs $0" made two of the seven
  # SEVERE findings a permanent, unactionable red.
  - match: "^kids spag bol$"
    reason: "discontinued (Zak, 2026-08-16). Its only line was the bolognese
      batch, retired as redundant, and the dish went with it. Delist in Back
      Office — inventing a sauce is how a $13 dish gets a made-up GP."
  - match: "^sea foam pet nat"
    reason: "discontinued (Zak, 2026-08-16). Already on the reorder skill's
      exclusion list, so no invoice will ever price it again, yet the POS still
      offers it at $28 on delivery. Delist it."
  - match: "^open (price|food)$"
    reason: "an open-price key rings whatever the operator types — there is no
      product behind it, so there is nothing to cost. It is a payment method
      wearing a SKU."
  - match: "^(delivery fee|surcharge|booking fee|service charge|tip|gift ?card|voucher|deposit|donation)"
    reason: "a fee has no food cost by nature. audit_book already labels these
      separately in its 100%-GP split; they are not a recipe gap."
  # PACKAGES — Zak, 2026-08-21: "packages will never get a cost, they will be
  # costed on a case-by-case basis in our functions module."
  #
  # These are not dishes and no chef can produce a recipe for one. A set menu at
  # $80 a head is whatever that particular function ate; the cost is assembled
  # per booking in the functions module, not per SKU here. Carrying them in the
  # recipe queue put $47,910/yr of permanently unanswerable work in front of the
  # kitchen and made the rest of the queue look optional.
  - match: "^\\$\\d+ "
    reason: "a package, priced per head. Zak 2026-08-21: packages are costed
      case-by-case in the functions module and will never carry a recipe. The
      price IS the product name ($80 Razzle Dazzle, $60 Soiree), which is what
      makes them detectable."
  - match: "^unlimited "
    reason: "a bottomless/unlimited package (Zak, 2026-08-21). Costed per
      function in the functions module; there is no fixed build to write down."
  - match: "^blind winos ticket$"
    reason: "a one-off event ticket, and the event is done (Zak, 2026-08-21).
      Nothing to cost and nothing that will ever sell again."
  - match: "^carafe sparkling water$"
    reason: "free (Zak, 2026-08-21: 'carafe sparkling water is free'). Plain
      carbonated water poured from the gun, same as the free water line in
      Virgin Margy and the free soda in Yuzu Orange Soda — no ingredient
      behind it to cost."

# DECISIONS AND QUESTIONS NO DATA IN THIS REPO CAN SETTLE.
#
# Each one states what would settle it. The numbers inside them are still looked
# up at build time where they exist in data/ (see `verify` below), so a flag can
# never quote a price that has since moved.
declared:
  # CLOSED 2026-08-21 by Zak: "harry gatos rooster and alehouse = stowaway
  # stock and price."
  #
  # The flag asked whether HG's "Alehouse Premium Lager" was really the CRISP
  # keg under the wrong name, or Premium at the wrong price. It is Premium, at
  # Premium's price, and the reason the question could not be settled from data
  # is stated in the flag's own evidence: no ILG invoice is billed to Harry
  # Gatos. That is how the group buys, not a defect.
  #
  # THE BOOK WAS ALREADY DOING THE RIGHT THING. The $185/keg figure the flag
  # was built on is a bo-seed-harry_gatos row dated 2026-01-01 — and it has been
  # superseded by THIRTY-THREE invoice-fed rows at $0.004292/ml (ILG 122-2858,
  # ALEHOUSE PREMIUM KEG, against a chef-confirmed 49.5 L vessel), the most
  # recent 03748652 on 18 Aug. All five products that pour off it — Harry's
  # Lager, its Schooner, Pint and Jug, and the Soju Bomb — take $0.004292/ml
  # today. The stale seed sits in the history where it belongs and reaches
  # nothing.
  #
  # So Zak's ruling confirms the number the book already uses, and the wider
  # rule it belongs to is written down in data/README_GLOBAL_PRICING.md: a
  # venue's copy of a product is not a separate product with its own price.
  #
  # Deleted rather than kept as a closed entry, following the ILG precedent
  # below: a decision flag exists to ask a question, and this one is answered.

  # CLOSED 2026-08-10 (063d9b7, b2ef362). The unit question it was waiting on was
  # answered and the re-parse ran: ilg.one_unit_pack() makes pack_qty describe ONE
  # unit whenever qty counts units, so the price and the pack divide the same
  # thing and cost_per_base_unit holds instead of dropping 6x. Veuve Clicquot
  # lands at $80.76 a bottle / $107.68 per L.
  #
  # 49 of 55 invoices re-parsed from the corpus; the last six were recovered from
  # the accounts@ mailbox, each PDF's sha256 matching the source_pdf its own
  # invoice JSON had recorded months earlier. 331 rows re-derived, 138 repack
  # lines RAISED (they were the 6x-low ones, live in the book), no ILG cost fell.
  # The ten /pricing "price rises" this flag cited as corroboration are gone —
  # test_the_pricing_pages_pack_read_movers_are_gone now guards their absence.
  #
  # Deleted rather than left as a closed entry because a decision flag exists to
  # ask a question, and this one has an answer in the code
  # (modules/invoices/tests/test_ilg_pack_matches_qty.py, 48 assertions).
