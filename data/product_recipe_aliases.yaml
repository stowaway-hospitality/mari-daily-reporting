"Orange Juice Glass [HG]": "Orange Juice Glass"

# An accent is not a rename.
"Vinada Sparkling Rosé [HG]": "Vinada Sparkling Rose"

# HG drops the producer from the label; Stowaway keeps it. "Zagara" is Year
# Wines' orange and there is exactly one of it in the book, in both sizes.
"Zagara Orange [HG] - Regular": "Year Wines 'Zagara' Orange - Regular"
"Zagara Orange [HG] - Bottle": "Year Wines 'Zagara' Orange - Bottle"

