- recipes: ["Dragon Soda"]
  create: true
  name: "Dragon Soda [1L]"
  ref: "Dragon Soda [1L]"
  subrecipe: true
  qty: 0.03
  unit: "ea"
  why: "30 ml of the 1 L build, matching Stow Soda - Grapefruit's 30 ml at the same $9"

# Kraken by the nip. The bottle is costed — "Kraken Black Spiced Rum [700ml]" at
