# --- Postmix: the mixer was never on the drink -----------------------------------
# Zak, 2026-08-06: "lemon lime bitters is the same as lemonade, plus the bitters"
# and "pink lemonade should be the same qty of postmix as the rest".
#
# Lemon, Lime & Bitters carried 2 ml of Angostura and nothing else — a $5.00 drink
# costing 20c, 95.6% GP. Pink Lemonade Glass carried only the raspberry cordial.
#
# The postmix cost was in Back Office the whole time. Stowaway holds four mixer
# products — Lemonade, Pepsi, Pepsi Max, Pink Lemonade — and every one is
# $0.8032 for one serve, to four decimal places. Four flavours at an identical
# figure is one postmix cost applied to all of them, which is also why Zak's
# "creaming soda postmix from CUB" for the pink lemonade changes the flavour and
# not the number.
# SUPERSEDED 2026-08-19: the $0.8032 was a Back Office figure with nothing behind
# it. The syrup itself is now costed from Zak's CUB order — $300.29 incl for a
# 10L BIB — so a 170 ml glass is 28.33 ml of syrup at the standard 1:5 gun ratio,
# $0.851. Nearly the same number, and now it is one somebody can check.
- recipes:
    - "Lemon, Lime & Bitters"
  name: "Schweppes Lemonade Postmix 15L BIB"
  ref: "cub:SCHWLEM15L"
  qty: 28.33
  unit: "ml"
  why: "Zak: LLB is lemonade plus the bitters; the lemonade is gun postmix"
# REMOVED 2026-08-19. Pink Lemonade Glass now has a full hand-authored recipe in
# data/recipes/stowaway.yaml — Zak: "pink lemonade is now creaming soda postmix"
# — so adding a line here as well double-counted the drink at $1.65.

# --- Drinks Produce has no recipe for AT ALL -------------------------------------
# `create: true` makes the entry rather than adding to one. Everything below is a
# drink Harry Gatos sells that Lightspeed Produce simply never had a build for, so
# it could not be costed by any route — it was not an incomplete recipe, it was an
# absent one. Zak, 2026-08-06: "go and do it all. i've absolutely put costs for
# these into lightspeed, or there's invoices for them." He was right; every number
# below already existed somewhere in the system.

# Soda & lime. Zak, 2026-08-06: "soda + lime's cost is only 1/12 of a lime unit."
# "Lime [ea]" is an existing costed product — 0.0167 of a $30 Lime [Tray], i.e.
# $0.50 a lime — so a twelfth of one is 0.0833 of that recipe. The soda itself is
# postmix off the gun and is not a line.
- recipes: ["Soda & Lime Glass"]
  create: true
  name: "Lime [ea]"
  ref: "Lime [ea]"
  subrecipe: true
  qty: 0.0833
  unit: "ea"
  why: "Zak 2026-08-06: a twelfth of a lime unit; soda is off the gun"

# Lemonade by the glass. The postmix already carries a cost in Back Office —
# "Lemonade [mixer]" at $0.8032, the same product and the same price at both
# venues — and the glass simply never referenced it. Same shape as the Lemon,
# Lime & Bitters and Pink Lemonade Glass entries above.
# REMOVED 2026-08-19. Lemonade Glass now has a full hand-authored recipe in
# data/recipes/stowaway.yaml drawing 28.33 ml of the CUB lemonade syrup, so
# creating it here too gave the glass two lots of lemonade at $1.65.

# Harry Gatos' mulled wine is Stowaway's mulled wine. Stowaway holds the full
# build (Sailor Jerry, Kahlua, black cacao, walnut bitters, De Bortoli red, sugar
# syrup); HG's entry is a bare $15 product with no lines. The name carries the
# venue tag so the name-keyed book cannot resolve it on its own — hence one
# sub-recipe line rather than a mirror.
- recipes: ["Mulled Wine [HG]"]
  create: true
  name: "Mulled Wine"
  ref: "Mulled Wine"
  subrecipe: true
  qty: 1
  unit: "ea"
  why: "same drink, same spec; Stowaway holds the build"

# Dragon Soda. Zak, 2026-08-06: "i've also given you a dragon soda recipe, no?" —
