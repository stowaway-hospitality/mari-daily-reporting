    - "Large Roma Special Wings Deal"
    - "Large Sanchez Wings Deal"
    - "Large Sanchez [Vegan] Wings Deal"
    - "Large Sorrento Wings Deal"
    - "Large Super House Special Wings Deal"
    - "Large Tandoori Chicken Wings Deal"
    - "Large Truffalo Soldier Wings Deal"
