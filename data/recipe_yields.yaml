# Batch yields, read from Lightspeed Produce on 2026-08-09.
#
# WHY THIS FILE EXISTS
# --------------------
# Zak: "the [1L] labels are LABELS not yields. the yields are on lightspeed."
# He is right, and the scrape never captured them: 0 of 852 recipes in
# data/lightspeed_recipes.json carry a yield, so anything needing one fell back to
# the number in the NAME. That is wrong for most batches and wildly wrong for
# some — every drink or dish drawing on the batch inherits the error:
#
#   Jalapeno Tequila [1L]              label 1000 mL  ->  REAL 7500 mL   (7.5x)
#   Coconut-washed Rooster Blanco [1L] label 1000 mL  ->  REAL 3929 mL   (3.9x)
#   Cooked Beef Brisket [1Kg]          label 1000 g   ->  REAL 10.5 kg   (10.5x)
#   Mango-Chilli Puree [1L]            label 1000 mL  ->  REAL 1050 mL
#   Demerara Syrup                     label     —    ->  REAL  560 mL
#   Super Lemon / Super Lime [1L]      label 1000 mL  ->  REAL 1142 mL
#
# A batch cost spread over 1 L when the batch is really 7.5 L makes every serve
# read 7.5x dearer than it is. That direction UNDER-states GP, so it does not
# flatter and nothing alarms — it just quietly makes good drinks look bad.
#
# HOW IT WAS READ: produce.kounta.com -> each recipe -> the "Expected yield"
# field, harvested per recipe. Source of truth is Lightspeed; if a yield changes
# there, re-harvest rather than editing a number here by hand.

