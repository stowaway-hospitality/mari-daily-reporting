# Lines where Produce names a bottle the venue no longer pours.
#
# NOT an alias. data/../scripts/convert_lightspeed_recipes.py's INGREDIENT_ALIAS
# says "these two names are the same stock" — Whispering Angel [HG] and Stowaway's
# Whispering Angel are one bottle filed twice. This file says something different
# and weaker: Produce records ingredient A, the bar actually pours ingredient B.
# Two different products. Conflating the two in the alias map would record a lie
# in the one place the codebase treats as a statement of fact about stock.
#
# Scoped to (recipe, ingredient) on purpose. A global name->name rewrite would
# also swallow the next recipe that legitimately uses the old bottle, and would
# keep hiding it if Produce ever puts a real price on it.
#
# Each entry needs Zak, by name and date. A swap changes what a drink COSTS, and
# no amount of arithmetic can tell you what is in the bottle on the shelf.

- recipe: "Caipirinha [HG]"
  from: "Velho Berreiro Cachaça [Bottle]"
  to: "Germano Caetano Cachaça [Bottle]"
  # Zak, 2026-08-06: "caipirinha should be using a different cachaca, germana?"
  # then "yes swap the cachaca".
  #
  # Harry Gatos' Produce carries Velho Berreiro at CostPriceIncTax 0.0000 and it
  # appears on exactly one recipe — this one — so a $19.00 cocktail reported 100%
  # GP on its only ingredient. There is no Velho Berreiro on any invoice in the
  # group, which is consistent with Zak: the bottle is not bought because it is
  # not poured.
  #
  # CORROBORATION: Stowaway's own "Caipirinha" is 60 mL of "Germano Caetano
  # Cachaça [Bottle]" — the same drink, the same quantity, the bottle Zak names.
  # The swap makes the two venues' Caipirinha the same drink, which is what it
  # always was.
  #
  # Produce's stated line cost is dropped with the swap: $0.00 was Produce's
  # figure for the OTHER bottle, and carrying it over would let a price for
  # something we don't pour keep speaking for something we do.
  why: "Zak 2026-08-06; Stowaway's own Caipirinha is 60 mL of the same Germana"
