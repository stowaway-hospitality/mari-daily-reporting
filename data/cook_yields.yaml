# MEASURED cook loss. Raw goes in, cooked comes out, and the plate is served from
# what comes out — so a recipe whose quantity is the PLATED weight is understating
# what the kitchen actually bought.
#
# Every entry here is a weighing somebody did. Nothing is estimated, inferred from
# a published range, or carried across from a similar protein: the three roasts
# are the same plate with the protein swapped and they do not shrink at the same
# rate, which is why each one has to be weighed on its own.
#
# WHAT IT DOES: scales the line's QUANTITY from plated to raw, by 1/yield. The
# quantity is the honest place for it — after this the recipe says "this plate
# consumes 258 g of raw lamb", which is both the true cost and the true purchase.
# The COST is not touched directly; it follows the quantity, as it should.
#
# WHERE THE 0.65 WENT. data/cost_book_flags.yaml carries `assumed_yield: 0.65` to
# SIZE the cook-loss questions, and says in its own comment: "0.65 IS NOT A
# MEASUREMENT AND IS NEVER APPLIED TO A COST... The moment Zak weighs one, the
# real number goes into the recipe and this whole block should be deleted rather
# than corrected." This file is where the real number goes. A subject that lands
# here comes OUT of that block.
#
# The measured lamb figure is 85.2%, well above the 65% the question was sized
# with — so the money at stake was smaller than the flag estimated. That is worth
# knowing before anyone reads the other two roasts' dollar figures as facts.

- recipe: "Lamb Roast"
  ingredient_ref: "lightspeed:22888695"
  ingredient: "Lamb Leg Boned & Rolled Netted [1kg]"
  yield: 0.851852          # 2.3 / 2.7
  measured: "2.7 kg raw in -> 2.3 kg cooked out, one boned-and-rolled leg"
  by: "Zak"
  on: 2026-08-15
  note: >-
    The recipe's 220 g is PLATED — Zak confirmed that when the question was
    written. At 85.19% the raw joint behind a 220 g plate is 258.3 g, so the
    protein line moves $4.29 -> $5.04 and Lamb Roast $6.62 -> $7.37 against a
    $30.00 sell. Pork Roast and Beef Roast are deliberately NOT changed: same
    plate, different protein, and nobody has weighed them.
