# Batch yields whose UNIT LABEL is wrong, corrected by reading the yield's own
# stated basis. Read only by scripts/materialise_recipes.py.
#
# WHY THIS FILE EXISTS
# --------------------
# 22 Marilyna's products would not cost under modules/recipes/cost.py: three
# batches declare a yield in ml while every recipe draws them in g, and cost_on
# refuses to convert mass to volume without a density. The old converter
# converted 1 g = 1 ml in silence, which is how nobody noticed.
#
# The reflex is to declare a density. For two of these three that would be
# inventing a second assumption to paper over the first, because THE YIELD
# NUMBER IS ITSELF A SUM OF MIXED UNITS. prep_yields.yaml states the basis in
# its own words -- "sum of ingredients x1" -- and the sum adds grams to
# millilitres. A number produced that way has no unit; the "ml" on it is a
# label somebody had to pick, not a measurement anybody took.
#
# So the correction is not "assume a density", it is "read the label off the
# component that dominates the sum, and off the unit every drawing recipe
# already uses". That REMOVES an assumption rather than adding one.
#
# THIS DOES NOT MAKE THE YIELDS RIGHT. Each is still an estimate, still wrong in
# the flattering direction by roughly the oil fraction. That error existed
# identically before this file -- 1500 ml converted 1:1 is the same number as
# 1500 g -- so nothing is worse, and it is now written where a weighing retires
# it. WEIGH THESE BATCHES.

yield_unit_fixes:

  - batch: "Garlic Oil [Batch]"
    from_unit: "ml"
    to_unit: "g"
    weigh_this: true
    proof: >-
      The batch is 1000 g peeled garlic + 500 ml vegetable oil, and
      prep_yields.yaml gives 1500 with basis "sum of ingredients x1" -- i.e.
      1000 + 500, a mass added to a volume. Two thirds of that sum is a mass,
      and all 10 recipe lines drawing on it are written in g.
      Residual error, stated: at 0.92 g/ml the oil is 460 g, so the true batch
      is ~1460 g; calling it 1500 overstates yield by 2.7% and understates the
      cost of every dish using it by the same. Identical to the error already
      present under the 1:1 conversion.

  - batch: "Mint Yoghurt [Batch]"
    from_unit: "ml"
    to_unit: "g"
    weigh_this: true
    proof: >-
      1000 g Greek yoghurt + 2 bunch mint + 100 ml lime juice, and
      prep_yields.yaml gives 1102 = 1000 + 100 + 2 -- grams, millilitres and
      BUNCHES added together. Over 90% of the sum is the yoghurt, a mass; all 6
      drawing lines are in g. Greek yoghurt is ~1.03 g/ml, so the label swap is
      within 3% either way regardless.

# Chimichurri is deliberately NOT in the list above.
#
# Its yield really is a volume: 500 ml oil + 60 ml vinegar dominate the batch,
# and the hand-authored record in data/recipes/marilynas.yaml independently
# declares 650 ml. There the mislabelled thing is the DRAWING LINE -- the
# scrape's "J.J. Aioli [Batch]" asks for 60 g of it while the hand-authored
# "Jimmy Jury Aioli", the same sauce entered by a person from Zak's recipe doc,
# asks for 60 ml. A human wrote ml; the scrape wrote g.

line_unit_fixes:

  - recipe: "Mulled Wine PartyJar (4)"
    ingredient: "Mulled Wine"
    from_unit: "ml"
    to_unit: "ea"
    proof: >-
      The line reads "3.89 ml" of a drink, which is not a quantity of anything.
      Its unit is junk but its MAGNITUDE is exact: the scrape's own line cost is
      $8.127473 and one Mulled Wine costs $2.0908, and 8.127473 / 2.0908 =
      3.8872 -- the 3.89 on the line, to four figures. So the number counts
      SERVES, and a PartyJar (4) holding 3.89 serves is what a 4-serve jar
      holds once you allow for what stays in the jug. Mulled Wine therefore
      yields 1 ea and this line draws 3.89 of them.

  # The J.J. Aioli -> Chimichurri fix that used to sit here (g -> ml, on the
  # evidence of the hand-authored "Jimmy Jury Aioli" reading 60 ml) was RETIRED
  # on 2026-08-16 when the house rule landed. Chimichurri is a sauce, so it is
  # grams, and the line follows the batch. The hand-authored ml was the older
  # convention, not a measurement.

# ---------------------------------------------------------------------------
# RULED: the whole batch. Zak, 2026-08-16.
# ---------------------------------------------------------------------------
# `Tandoori Chicken [2Kg]` drew "1 ml" of `Tandoori Sauce [Batch]`, which yields
# 1,116 g, and six products refused to cost because of it. The "1" is the "a 1
# that is really a 1kg tub" pattern prep_yields.yaml names in its own basis text
# -- but 1 KG of sauce and the WHOLE 1,116 g batch are different answers, 12%
# apart on six products, so the derived rule held rather than guessing.
#
# Three independent readings, all pointing at the whole batch:
#
#   1. THE NAME. The batch is called [2Kg] and prep_yields declares 2,000 g.
#   2. THE ARITHMETIC. 1,000 g chicken + the whole 1,116 g sauce = 2,116 g in
#      against 2,000 g out: a 5.5% loss, normal for a marinated batch. Read as
#      1 kg of sauce it is 2,000 g in and 2,000 g out -- zero loss, which
#      nothing cooked does. Read literally it is 1,001 g in and 2,000 g out,
#      which is impossible. See scripts/audit_batch_yields.py.
#   3. THE PATTERN. Identical in shape to House BBQ Sauce ("2 ml" = two 4 L
#      packs) and Truffle Oil Prep ("4 ml" = four 250 ml bottles), both proven.
#
# Reading 2 is the one that carries it: it is the only one of the three that
# produces a physically possible batch. It still rests on prep_yields' 2,000 g,
# which is scraped rather than weighed -- so WEIGH A TANDOORI BATCH and this
# becomes a measurement instead of an inference.

line_qty_unit_fixes:

  # SUPERSEDED 2026-08-19, and the way it died is the lesson.
  #
  # The entry above was written against a record reading "1,000 g chicken +
  # 1 ml sauce". Renan has since re-saved the recipe as "1,700 g chicken +
  # 400 ml sauce". The fix keys on from_qty, so the moment the record moved it
  # stopped matching -- SILENTLY. It went on being read, went on looking like
  # a fix in the file, and corrected nothing, which is why the last session
  # recorded that declaring the relabel "does relabel the line but does not
  # move the cost".
  #
  # A DECLARED FIX THAT NO LONGER MATCHES ANYTHING SHOULD SAY SO. Until it can,
  # treat every from_qty in this file as a claim about a record that a chef can
  # edit at any time.
  #
  # The same three readings still hold on the new numbers, and reading 2 still
  # carries it:
  #
  #   1,700 g chicken + 400 g sauce = 2,100 g in against the 2,000 g out that
  #   prep_yields declares -- a 4.8% loss, normal for a marinated batch that is
  #   cooked. 400 g of marinade on 1.7 kg of chicken is 24% by weight, which is
  #   what a tandoori marinade is.
  #
  #   Read literally, 400 ML of a batch that yields GRAMS is not a quantity at
  #   all: Lightspeed priced it at $2,940, 225x the whole $13 batch.
  #
  # Still resting on prep_yields' scraped 2,000 g, so it is still an inference.
  # WEIGH A TANDOORI BATCH and it becomes a measurement.
  - recipe: "Tandoori Chicken [2Kg]"
    ingredient: "Tandoori Sauce [Batch]"
    from_qty: 400
    from_unit: "ml"
    to_qty: 400           # the quantity was never wrong -- only the unit was
    to_unit: "g"
    weigh_this: true

# ---------------------------------------------------------------------------
# SERVE YIELDS — read ONLY by scripts/materialise_recipes.py.
# ---------------------------------------------------------------------------
# Three products are SOLD and also used as a sub-recipe: a wings deal contains
# "1 ea" of BBQ Wings, a PartyJar contains 3.89 Mulled Wines, a Caffe Crema
# draws 30 ml of an Espresso Martini. cost_on needs a yield to divide by, so
# each needs to declare "1 serve".
#
# THEY MUST NOT GO IN prep_yields.yaml. That file is read by the converter and
# by audit_book, and both use "has a yield" to mean "is a batch" -- and a batch
# is deliberately excluded from serve costs, because publishing a batch cost
# against every unit sold is a 4x over-cost (the Dragon Soda case). Putting
# these three there made three SOLD products cost $0.00 and report 100% GP, and
# tests/test_no_free_menu_items.py caught it within the hour.
#
# The distinction that matters is already written down in cogs_blend: a batch
# declares a yield and carries NO SELL PRICE; a serve carries a sell price and
# no yield. These carry sell prices. They are serves that happen to be
# reachable from another recipe, so their yield lives here, where only the one
# consumer that needs it can see it.
#
# Nothing here needs weighing. One serve is one serve.

serve_yields:
  - product: "BBQ Wings"
    yield_qty: 1
    yield_unit: "ea"
  - product: "Mulled Wine"
    yield_qty: 1
    yield_unit: "ea"
  - product: "Espresso Martini"
    # 80 ml, not 1 serve: Caffe Crema draws 30 ml of it, so the divisor has to be
    # a volume. Its own lines sum to 79.6 ml (30 coffee + 25 vodka + 12 Kahlua +
    # 12 rum + trace), which is what one is before ice.
    yield_qty: 80
    yield_unit: "ml"
