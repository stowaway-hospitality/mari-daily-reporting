# Lines where Produce's UNIT is a typo, corrected with arithmetic proof.
#
# "The unit in Produce is not trustworthy — only the magnitude is" (HANDOFF
# 2026-08-05). Usually we refuse to reinterpret a unit, because reading "0.35 ml"
# as 0.35 KG took Rosemary Salted Fries from $1.86 to $0.0019. So this file needs
# more than a hunch: the entry must state the proof, and the proof must be
# arithmetic, not judgement.
#
# Keep this file SMALL. If a line needs a paragraph of reasoning rather than a
# sum, it does not belong here — flag it in the audit instead.

- recipe: "Peking Sauce [6.75L]"
  ingredient: "Soy Sauce Tamari Spiral [10L]"
  from_unit: "L"
  to_unit: "mL"
  cost_factor: 0.001   # Produce derived its $10,500 from the SAME typo: $14/L x 750 L
  # PROOF: read every quantity in this recipe as g/mL and they sum to
  #   1500 + 750 + 750 + 1500 + 750 + 375 + 375 + 750 = 6750
  # which is EXACTLY the 6.75L the recipe name declares. A batch cannot yield more
  # than it contains, so all eight are base units and the "L" labels are typos.
  #
  # CORROBORATION: Produce's own line costs already price four of the five "L"
  # lines as mL — tomato $4.13, sake $1.39, sriracha $4.47, vinegar $3.75, all
  # sane. Only the soy line did Produce ALSO read as litres, at $10,500.00, and
  # that is the one number our book inherited. $14/L x 750 L = $10,500;
  # 750 mL of the same soy is $10.50.
  #
  # EFFECT: the batch drops $10,530.95 -> $41.45 for 6.75L ($0.0061/mL). No dish
  # was over-costed by it — the three spring rolls that draw on it were already
  # costing 15mL at $0.09 via the Lightspeed ratio path — but the batch record
  # itself was nonsense and it masked everything else in the audit.
  why: "quantities sum to exactly the declared 6.75L yield; 4 of 5 sibling L-lines already cost as mL"

# The same proof covers the other four "L" lines in this recipe. These need NO
# cost_factor: Produce already priced them as mL (tomato $4.13, sake $1.39,
# sriracha $4.47, vinegar $3.75 — all sane), so only the label was wrong. Fixing
# them makes the inputs sum to 6750 and the batch stop reading as 500x its yield.
- recipe: "Peking Sauce [6.75L]"
  ingredient: "Tomato Sauce Heinz [4L]"
  from_unit: "L"
  to_unit: "mL"
  why: "see the Soy Tamari entry: all eight quantities sum to the declared 6.75L"
- recipe: "Peking Sauce [6.75L]"
  ingredient: "Cooking Sake Jun [18L]"
  from_unit: "L"
  to_unit: "mL"
  why: "as above"
- recipe: "Peking Sauce [6.75L]"
  ingredient: "Sriracha [730mL]"
  from_unit: "L"
  to_unit: "mL"
  why: "as above"
- recipe: "Peking Sauce [6.75L]"
  ingredient: "Rice Wine Vinegar [500mL]"
  from_unit: "L"
  to_unit: "mL"
  why: "as above"

# Harry Gatos. The same bulk-label defect as Peking Sauce, but at 20 the quantity
# sits under the >25 L/kg bound that convert_lightspeed_recipes.py uses to read a
# bulk label as base units — so it needs naming here, with its own proof.
- recipe: "Corpse Reviver No. 2 [HG]"
  ingredient: "Massenez Triple Sec [5L]"
  from_unit: "L"
  to_unit: "mL"
  cost_factor: 0.001   # Produce derived its $1,080.32 from the SAME label: $54/L x 20 L
  # PROOF: the recipe's other three lines are 20 mL gin, 20 mL Lillet Blanc and
  # 2 mL absinthe. A Corpse Reviver No. 2 is equal parts gin, triple sec, Lillet
  # and lemon with an absinthe rinse, and three of those four parts are written
  # here as 20 mL. The fourth is 20 of the same thing.
  #
  # EFFECT: the cocktail drops $1,438.40 -> ~$2.75 against a $21.00 sell price.
  # Before the unit normalisation this line was silently rejected and cost $0,
  # which is why a 1000x error in a live cocktail had never surfaced.
  why: "three sibling lines in the same drink are 20 mL; the spec is equal parts"

# Stowaway. The bird is 0.5 of an EACH, not 0.5 of a millilitre. Not a magnitude
# defect like the two above — the dollar figure was already right — but a unit
# that means nothing cannot be reconciled against an invoice, so the line could
# never track the supplier.
- recipe: "Chicken Roast"
  ingredient: "Chicken Whole Bird [No.8]"
  from_unit: "ml"
  to_unit: "ea"
  # NO cost_factor, deliberately. Produce's $3.05 did not come from the wrong
  # label — it is exactly half of $6.10, which is what a No.8 bird costs.
  #
  # PROOF: our cost book prices lightspeed:22992669 at $6.1000 per EACH
  # (bo-ingredient-seed-stowaway; the row's unit word is "can", which _BASE
  # renames to "ea"), and data/product_map.csv bridges that ProductID to B&E code
  # 10677, which has billed "CHICKEN - WHOLE BIRD NO.8" at $6.1000 per unit on
  # more than twenty invoices since April. 0.5 x $6.10 = $3.05 — the figure
  # Produce itself states for the line, to the cent, from a source that never saw
  # it. Half a bird per roast is also the physical reading of "No.8".
  #
  # EFFECT ON THE COST: none, today. The line already contributed $3.05, reached
  # by the dimensionless seed-ratio fallback — a "ml" quantity can never be
  # multiplied by a per-each price, so `our_cost` was left null and the SCRAPED
  # dollar figure carried the line. What changes is the provenance: with the unit
  # right the line is priced as our_book_rate x qty, so a B&E price rise moves the
  # roast. Under the old label it never could — the plate would have kept costing
  # $3.05 for a bird that had gone to $7.
  why: "our book prices the bird per each at $6.10 and B&E 10677 bills it per unit; 0.5 x $6.10 is Produce's own $3.05 to the cent"

# ==========================================================================
# LABEL-ONLY, 2026-08-14. Nine ingredients, sixteen lines, NO cost_factor.
# ==========================================================================
#
# These are the other half of what this file is for, and the half that had never
# been used. The Peking Sauce entries above change a COST because Produce derived
# the cost from the same wrong unit. These do the opposite: Produce already
# costed the line correctly and typed the unit wrong, so the money must not move.
#
# THE PROOF IS THE SAME SUM EVERY TIME, and it is why these are safe where the
# three below them are not. Take the line's quantity, multiply by the
# ingredient's own per-pack rate, and compare with what the book actually
# charges:
#
#   Broccolini   0.22 x $3.17/bunch = $0.6974   book: $0.6945   ratio 0.996
#   Parsley      2    x $1.50/bunch = $3.0000   book: $3.0000   ratio 1.000
#   Thyme        1    x $1.65/bunch = $1.6500   book: $1.6500   ratio 1.000
#   Lettuce      0.083 x $2.75/ea   = $0.2283   book: $0.2283   ratio 1.000
#   Lime         0.0167 x $30/tray  = $0.5010   book: $0.5000   ratio 0.998
#   Radish       0.1  x $2.88/bunch = $0.2880   book: $0.2900   ratio 1.007
#   Mint         2    x $1.30/bunch = $2.6000   book: $2.6000   ratio 1.000
#   Coriander    2    x $2.60/bunch = $5.2000   book: $5.0000   ratio 0.962 *
#   Garlic Bread 1    x $1.4952/ea  = $1.4952   book: $1.4200   ratio 0.950 *
#
# A ratio of 1.0 means the NUMBER IS ALREADY BEING READ AS PACKS and only the
# word is wrong. (* the two under 1.0 are rate drift — the book's rate moved
# after Produce costed the line — not a different reading. Both are still
# unambiguously "packs", not grams: read as grams they would be ~1000x out.)
#
# WHAT THIS DELIBERATELY DOES NOT TOUCH. Three ingredients in the same family
# fail the same test and are NOT here — Shallot (900 g of it in Tonkotsu Broth,
# ratio 0.0034), Choi Sum (0.0010) and chives (0.0250). Those lines genuinely
# ARE in grams, and the fix is a bunch weight off a set of scales, which is what
# their flags ask for. Relabelling them would turn 900 g of shallots into 900
# BUNCHES. Ratio ~1 gets a label fix; ratio ~0.001 gets a weighing; anything in
# between (Corn Baby Sweet at 2.00, Herb Coriander at 2.03, Edible Flower at
# 0.03) is a real question and stays flagged.

- {recipe: "Beef Roast",    ingredient: "Broccolini [Bunch]", from_unit: "ml", to_unit: "bunch",
   why: "0.22 x $3.17/bunch = $0.6974 against the book's $0.6945"}
- {recipe: "Chicken Roast", ingredient: "Broccolini [Bunch]", from_unit: "ml", to_unit: "bunch",
   why: "same portion as the other four roasts"}
- {recipe: "Lamb Roast",    ingredient: "Broccolini [Bunch]", from_unit: "ml", to_unit: "bunch",
   why: "same portion as the other four roasts"}
- {recipe: "Nut Roast",     ingredient: "Broccolini [Bunch]", from_unit: "ml", to_unit: "bunch",
   why: "same portion as the other four roasts"}
- {recipe: "Pork Roast",    ingredient: "Broccolini [Bunch]", from_unit: "ml", to_unit: "bunch",
   why: "same portion as the other four roasts"}

- {recipe: "Guacamole [4kg]",       ingredient: "Coriander [bunch]", from_unit: "ml", to_unit: "bunch",
   why: "2 x $2.60/bunch = $5.20 against the book's $5.00 (rate drift); as grams it would be 2 g of coriander in a 4 kg batch"}
- {recipe: "Pico de Gallo [2.5kg]", ingredient: "Coriander [bunch]", from_unit: "ml", to_unit: "bunch",
   why: "1 x $2.60/bunch = $2.60 against the book's $2.50"}

- {recipe: "Chimichurri", ingredient: "Fresh Parsley [Bunch]", from_unit: "ml", to_unit: "bunch",
   why: "2 x $1.50/bunch = $3.00, exactly the book's $3.00"}

# GARLIC BREAD IS DELIBERATELY ABSENT, and this is the record of why.
#
# The two entries belong here on their own merits — 1 x $1.4952/ea against the
# book's $1.42, plainly a label. Shipped, rebuilt, and "Garlic Bread [Deal]" fell
# from $1.4952 to $0.0374. Exactly 40x, in the flattering direction.
#
# The mechanism is not in this file. Produce's Deal recipe references the line by
# its PACK-SIZED name, 'Garlic Bread [9" x40]'. norm() strips the bracket, so it
# resolves against the recipe named "Garlic Bread" — and while that recipe's line
# read "ml" it fell through to the single-piece PRODUCT (lightspeed:20467596,
# 1 ea, $1.4952) and cost correctly by accident. Relabelling the line to "ea"
# made the recipe a valid per-unit subrecipe, the pack-sized reference then
# resolved to it, and the x40 in the name divided the result.
#
# So the label fix is right and the resolver is fragile, and a low-severity
# cosmetic flag is not worth a 40x under-cost on a deal that sells. Left open;
# feed-line-unit-garlic-bread stays in the queue saying so. The real fix is in
# resolve()'s pack-sized-name branch, which needs its own test before it is
# touched.

- {recipe: "Nut Roast Prep", ingredient: "Herb Thyme [Bunch]", from_unit: "ml", to_unit: "bunch",
   why: "1 x $1.65/bunch = $1.65, exactly the book's $1.65"}

- {recipe: "American Standard Burger", ingredient: "Lettuce Cos Baby Twin Pack [Each]",
   from_unit: "ml", to_unit: "ea",
   why: "0.083 x $2.75/ea = $0.2283, exactly the book's $0.2283 — a twelfth of the twin pack. This is the line feed_defects names as its canonical example."}

- {recipe: "Lime [ea]", ingredient: "Lime [Tray]", from_unit: "ml", to_unit: "tray",
   why: "0.0167 x $30.00/tray = $0.5010 against the book's $0.5000 — a sixtieth of a tray, i.e. one lime"}

- {recipe: "Mint Yoghurt [Batch]", ingredient: "Mint [bunch]", from_unit: "ml", to_unit: "bunch",
   why: "2 x $1.30/bunch = $2.60, exactly the book's $2.60"}

- {recipe: "Eggplant Schnitty", ingredient: "Radish Red [Bunch]", from_unit: "ml", to_unit: "bunch",
   why: "0.1 x $2.88/bunch = $0.288 against the book's $0.29"}
- {recipe: "Stow Schnitty",     ingredient: "Radish Red [Bunch]", from_unit: "ml", to_unit: "bunch",
   why: "same garnish portion"}

# Pears Green, added 2026-08-14 after the pack override told the truth about the
# unit. Rocket Man takes "0.25 ml" of a pear and is charged $0.1625, which is a
# quarter of the $0.65 the book pays for ONE pear — ratio 1.0000. A quarter of a
# pear, muddled. Rocket Man D is the same drink (Zak confirmed) and inherits it.
- {recipe: "Rocket Man", ingredient: "Pears Green [kg]", from_unit: "ml", to_unit: "ea",
   why: "0.25 x $0.65/ea = $0.1625, exactly what the book charges"}

# Dry goods measured in "ml", 2026-08-14. Both cost NOTHING today: the ingredient
# is priced per GRAM and the line says ml, the dimensions disagree, so the book
# refuses to cost it and the line contributes $0 on a real quantity — the
# flattering direction. Relabelling ADDS cost, which is the safe direction, and
# ml is not a unit either of these has ever been sold in.
# NB the raw line is named just "Oregano" — INGREDIENT_ALIAS maps it to the
# costed "Oregano Leaves Rubbed - Torino" LATER, and apply_unit_fixes runs first,
# so this must match the name the scrape actually carries. "[Dine-in]" is a
# derived twin and inherits the fix rather than needing its own entry.
- {recipe: "Regular Little Italy", ingredient: "Oregano",
   from_unit: "ml", to_unit: "g",
   why: "rubbed oregano is bought by weight (Gulli WINORE-UC10, 500 g at $0.02/g) and 0.5 g is a pinch on a pizza; as ml it costs $0"}
- {recipe: "Frozen Marg", ingredient: "Dehydrated Lime Garnish",
   from_unit: "ml", to_unit: "g",
   why: "a dehydrated lime wheel is priced per gram ($0.092308/g) and weighs about the 1 the line asks for; as ml it costs $0"}

# Salsa Rosa asks for "1.5 ml" of pizza sauce. A third of a teaspoon of sauce in
# a 2.5 L batch is not a recipe; it means 1.5 KG. Unlike Peking, the MAGNITUDE is
# wrong here too, not just the label — hence qty_factor, and no cost_factor.
- recipe: "Salsa Rosa Prep"
  ingredient: "Pizza Sauce [Recipe] kg"    # the raw Produce name, "kg" and all
  from_unit: "ml"
  to_unit: "g"
  qty_factor: 1000        # 1.5 -> 1500 g
  # PROOF, from Produce's own arithmetic. It billed this line $5.63 for qty 1.5,
  # i.e. $3.7533 per unit. The pizza sauce batch it was costed against was
  # $37.19 for 9338 g = $3.98/kg. So the per-unit price Produce used IS the price
  # PER KILOGRAM, to within 6% — it multiplied kilos while printing "ml".
  #   1.5 kg x $3.75/kg = $5.63   <- reconciles to the printed line cost
  #   1.5 ml x $0.00398 = $0.006  <- out by a factor of 1000
  # A line cost can only reconcile at one magnitude, and it reconciles at kg.
  #
  # CORROBORATION: the sibling line "Roasted Red Peppers [A12]" is written the
  # same way — "1 ml" for one A12 tin at $15.91 — so this recipe writes pack and
  # batch quantities with a junk "ml" label throughout. Pizza sauce is the only
  # one of them that resolves to a costable sub-recipe, so it is the only one
  # whose magnitude our book can act on.
  #
  # EFFECT: the line stops being frozen and wires LIVE to the current Pizza Sauce
  # batch, so Salsa Rosa now re-costs when Kagome's price moves — and through it
  # Black Beans Prep, Pulled Mushroom, Burrito Rice Sauce and every burrito.
  why: "Produce's own $5.63 for qty 1.5 only reconciles at $3.75/KG; at ml it is out 1000x"

# ---------------------------------------------------------------------------
# Container products measured in g/ml (2026-08-21)
#
# A product bought by the tray/tin/bunch/pack has NO gram or millilitre rate in
# our book at all. So a line reading "1 ml" of it has never been priceable, and
# the feed has been quietly falling back to the Lightspeed scrape for years.
# Relabelling the line to the container unit changes no quantity — 1 stays 1 —
# and lets our own book price it for the first time.
#
# THE TEST APPLIED, and it is not "the name has a container in it". For each of
# these the container rate is INVOICE-FED, so moving the line onto it moves it
# onto a purchase. Where the rate was only a seed, or where the container price
# makes the dish absurd, the line is NOT here — see the two garnishes below.
#
# Zak, 2026-08-21: "the lightspeed scrape was just to give us a headstart on
# building our own costbook."

- recipe: "Guacamole [4kg]"
  ingredient: "Avocado [Tray]"
  from_unit: "ml"
  to_unit: "tray"
  # PROOF: lightspeed:22488995 is priced per TRAY and has no per-ml rate, so
  # "1 ml" resolved to nothing and the line fell through to Lightspeed's $25.00.
  # Invoice-fed: INB00101295 $26.40/tray, INB00101846 $28.60/tray via
  # fresh-fruit-team:AH20T. A 4 kg batch of guacamole from one tray of avocados
  # is also the only reading that fits the declared yield — a tray is ~20 fruit
  # at ~200 g of flesh, which is 4 kg exactly.
  why: "no per-ml rate exists for a tray product; 1 tray of avocados is the declared 4kg yield"

- recipe: "Guacamole [4kg]"
  ingredient: "Corn Kernels [Tin]"
  from_unit: "ml"
  to_unit: "ea"
  # PROOF: invoice 6910801 bills b-e:16058 at $1.30 for one 425 g tin, and the
  # seed was already corrected to it on 2026-08-20 ("the venue switched to the
  # 425g tin ... the 13812 bridge is retired"). Lightspeed's $2.00 is the older
  # A10-can era. One tin in a 4 kg batch; the quantity 1 does not move.
  why: "invoice 6910801 prices the tin at $1.30/ea; the $2.00 is the retired A10 scrape"

- recipe: "Corn Star"
  ingredient: "Corn Baby Sweet [Pack]"
  from_unit: "ml"
  to_unit: "ea"
  # PROOF: invoice-fed at $1.10/ea (INB00101295, INB00102666) and $1.32 at HG
  # (INB00103738) via fresh-fruit-team:CSCB. No per-ml rate exists. Quantity
  # stays 0.5 — half a pack of baby corn in a corn-based cocktail.
  why: "invoice-fed at $1.10/ea via fresh-fruit-team:CSCB; no per-ml rate exists"

- recipe: "Burrito Rice Sauce"
  ingredient: "Herb Coriander [Bunch]"
  from_unit: "ml"
  to_unit: "bunch"
  # PROOF: a bunch product with no per-ml rate. The $1.30/bunch seed is
  # corroborated by a REAL invoiced product of the same name and size,
  # select-fresh:HCOR at $1.30/bunch, so the rate is not scrape-only. The same
  # recipe already carries "Coriander Ground" separately, and Guacamole [4kg]
  # states its coriander as "2 bunch" correctly — so bunch is this book's
  # normal way of writing it and the "ml" here is the outlier.
  why: "select-fresh:HCOR invoices coriander at $1.30/bunch, matching the seed; no per-ml rate exists"

# Davidson Plum Hoisin draws "1000 ml" of Davidson Plum Puree (2026-08-21).
#
# PROOF, and it is arithmetic rather than judgement: the line ALREADY COSTS
# $51.00, and $51.00 is exactly 1000 x $0.051000/g — the invoiced Select Fresh
# rate for DAVIDSON PLUMS FROZEN KG. It has been priced as a kilogram of plums
# all along; only the unit word says otherwise. Lightspeed's own figure for the
# line is the same $51.00, so both books already agree on the money.
#
# The batch is a hoisin, and its other line is 9,079 g of Hoi Sin Sauce — the
# recipe states its ingredients in GRAMS throughout. The "ml" on this one line
# is the outlier, not the convention.
- recipe: "Davidson Plum Hoisin"
  ingredient: "Davidson Plum Puree"
  from_unit: "ml"
  to_unit: "g"
  why: "line already costs 1000 x $0.051000/g = $51.00, the invoiced per-kilo rate; the sibling line is in g"
