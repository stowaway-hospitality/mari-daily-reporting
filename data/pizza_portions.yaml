# WEIGHED pizza portions — Marilynas_Pizza_Portions_v2.xlsx, Zak, 2026-08-19.
#
# Supersedes data/pizza_regular_grams.yaml, which held REGULAR only. This holds
# all three sizes, so a Large is now a measurement rather than something derived
# from a Regular. That matters: on the morning of 2026-08-19 the converter was
# lifting Large quantities to regular/0.716 because Produce's Large figures were
# below the weighed Regulars and a bigger pizza cannot carry less. The lift was
# a reasonable inference from what was known, and this sheet shows it was WRONG
# for Spanish onion — v2 puts the regular at 10 g and the large at 20 g, which
# is exactly the figure Produce already had. The old sheet's 33 g regular was
# the bad number all along, and the lift propagated it onto seven pizzas.
#
# A MEASUREMENT ENDS AN ARGUMENT. That is the whole reason this file exists.
#
# The v2 sheet moves several old figures a long way, always downward:
#
#     ingredient          old regular   v2 regular   v2 large
#     Spanish onion            33            10          20
#     Chicken                 105            70         100
#     Tandoori chicken        126            91         127   <- old regular ~= v2 LARGE
#     Brown onion              36            19          32
#     Pineapple (std)          30            49          73   <- and this one upward
#
# Tandoori looks transposed in the old sheet: its "regular" 126 is within a gram
# of v2's LARGE 127, and Produce's large of 90 is within a gram of v2's regular
# 91. Two numbers swapped, and every Tandoori product costed off the pair.
#
# HOW TO READ IT (unchanged from the file it replaces): these CORRECT the
# quantity of a line already on a recipe. They never ADD a missing ingredient —
# a pizza's ingredient list stays whatever Produce says it is.
#
# `match` is a case-insensitive regex against our ingredient name. `when` narrows
# a weight to particular pizzas (some ingredients are portioned differently on
# one pizza — cheese on a Margherita, ham on a Hawaiian); the entry without
# `when` is the default and MUST come last for that ingredient, because first
# match wins.
#
# `family` is carried from the sheet but nothing reads it yet: the book holds
# Regular, Large and Gluten-free products and no Family ones. It is here so the
# day a Family pizza is listed, the number is already weighed.
#
# GLUTEN-FREE TAKES THE REGULAR PORTIONS. Its base is "Pizza Base Gluten Free
# 11in" — an 11" pizza is a regular, whatever the crust is made of.

portions:

  - label: "pizza base"
    match: "pizza dough"
    regular: 177
    large: 215
    family: 304

  - label: "pizza sauce"
    match: "pizza sauce"
    regular: 52
    large: 78
    family: 116

  # cheese is heavier on a Margherita — there is nothing else on it
  - label: "cheese (margherita)"
    match: "shredded mozzarella|big cheese"
    when: "margherita"
    regular: 100
    large: 125
    family: 187

  - label: "cheese (other pizzas)"
    match: "shredded mozzarella|big cheese"
    regular: 47
    large: 88
    family: 100

  - label: "pepperoni (pepperoni pizza)"
    match: "pepperoni"
    when: "pepperoni"
    regular: 62
    large: 80
    family: 110

  - label: "pepperoni (other pizzas)"
    match: "pepperoni"
    regular: 30
    large: 40
    family: 60

  - label: "mushroom ragu"
    match: "mushroom ragu"
    regular: 67
    large: 96
    family: 128

  - label: "mushroom"
    match: "mushroom"
    regular: 40
