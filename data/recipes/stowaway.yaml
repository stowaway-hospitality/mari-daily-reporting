# Jalapeño juice — Zak: pickled jalapeño slices blended with a touch of water,
# then strained. One 3kg tin plus ~500ml water goes in; the strained pulp is
# discarded, so the liquid off a soft pickled slice is roughly 60% of what went
# in = ~2.1L. Water is free, so the whole cost is the tin.
- product: "Jalapeno Juice Prep"
  yield_qty: 2100
  yield_unit: "ml"
  ingredients:
    - id: "lightspeed:22480112"
