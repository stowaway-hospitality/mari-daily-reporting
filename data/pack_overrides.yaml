- id: "lightspeed:20727779"           # Bittermen's Tiki Bitters [Bottle]
  pack_qty: 146
  pack_unit: ml
  # THREE sources disagree about this bottle and only one of them is a bottle
  # anybody sells. The product NAME says "700ML". Back Office's own DefaultSize
  # says 120. Paramount's invoice says, in words, "BITTERMENS XOCOLATL MOLE
  # BITTERMENS : 146 ml", raw UOM "12/146 ml", $29.44 the bottle (5424761
  # 2026-07-07 and 5457927 2026-07-21, code 67652). Bittermens ship one size.
  #
  # Our book read the pack off the NAME: $26.03 (Back Office CostPriceIncTax) /
  # 700 mL = $0.037186/mL. Over the real 146 mL the same $26.03 is $0.1783/mL,
  # which lands beside Paramount's own $29.44/146 = $0.2016/mL for the same
  # brand. 700 is not a Bittermens size and the two independent sources both
  # say "small bottle", so the NAME is the typo, not the price.
  #
  # 4.79x UNDER-cost — the flattering direction. Island Time is the only drink
  # on it (32 serves/yr), so the money is $3/yr; the reason to fix it is that
  # the same defect on a fast bottle would be invisible.
  by: "Claude (Paramount 5424761/5457927 state 146 ml in words; 700ML is not a Bittermens size)"
  on: 2026-08-14
  by_email: "hello@stowawaybar.com"
- id: "lightspeed:22684315"           # Massenez Elderflower [5L]
  pack_qty: 5000
  pack_unit: ml
  # This is the whole explanation of the Elderflower price conflict, and it is
  # mechanical: Back Office's DefaultSize carries an EXTRA ZERO. It reads 50000
  # mL against a cask the name calls [5L] and the CostPriceIncTax calls $253.00.
  #
  #   $253 / 50000 mL = $0.00506/mL   <- what Lightspeed's own recipe costing used
  #   $253 /  5000 mL = $0.05060/mL   <- what our book used, reading the name
  #
  # Lightspeed's recipe seed quotes $0.004833/mL. That is the 50000 reading, so
  # the flag's "both cannot be this product's price" has a cause rather than a
  # judgement: one side divided by 50 L of liqueur that does not exist.
  #
  # OURS IS THE RIGHT ONE, corroborated by every sibling in the same range and
  # the same pack: Triple Sec $0.0675/mL, Mango $0.0642, Cacao Blanc $0.0660,
  # Black Cacao $0.0600, Lychee $0.0580 — and Paramount invoice 5198837 puts
  # Massenez Triple Sec BIB at $71.80/L = $0.0718/mL. A 5 L Massenez at
  # $24.17 the cask (the 50000 reading) is not a price anyone has ever paid.
  #
  # Pinned rather than left alone because the next Back Office export will bring
  # the same 50000 back. The real repair is DefaultSize -> 5000 in Back Office.
  by: "Claude (BO DefaultSize 50000 is an extra zero on a [5L] cask; 5 siblings + Paramount BIB agree with 5000)"
  on: 2026-08-14
  by_email: "hello@stowawaybar.com"
- id: "lightspeed:22893568"           # Gyoza Vegetable Marumatsu Jun [800g], Harry Gatos
  pack_qty: 800
  pack_unit: g
  # Same extra-zero defect as the Elderflower, found by sweeping every Back
  # Office row for a DefaultSize that is an exact power of ten off the size
  # written in the product's own name. DefaultSize 8000 g against a name that
  # says [800g], CostPriceIncTax $9.25.
  #
  #   $9.25 / 8000 g = $0.001156/g   <- 10x UNDER
  #   $9.25 /  800 g = $0.011563/g   <- the pack the name and the price describe
  #
  # $9.25 for 8 kg of gyoza would be $1.16/kg. Frozen gyoza does not exist at
  # that price; at 800 g it is $11.56/kg, which is ordinary. Under-costing is
