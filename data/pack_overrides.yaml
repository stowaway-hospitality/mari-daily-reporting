# BROCE HAS NO PACK OVERRIDE, DELIBERATELY — a bunch IS the purchasable unit.
#
# 2026-08-16: Zak's "12 bunches per box" was recorded here, against BROCE. The
# FACT is right; the CODE was wrong. Fresh Fruit Team bill broccolini two ways
# and their own UOM column says which is which on every invoice:
#
#     BROCE   raw_uom "Bunch"   $3.17 - $3.60      <- one bunch
#     BRL     raw_uom "Box"     $28.80 - $36.00    <- one box
#
# So dividing BROCE by 12 divided a BUNCH by 12 and put broccolini in the chef's
# picker at $0.264167 a bunch against a real $3.17 — 12x under, in the direction
# that flatters GP and is never questioned. It also contradicted the BRL entry
# above, which has said "Broccolini, the BOX (BROCE is the bunch)" since 08-14.
#
# Nothing here caught it: the money still reconciled, every test stayed green,
# and CI cannot see a pack divisor. The count moved to BRL where it belongs.
# Left as a comment rather than a silent deletion so the next session does not
# re-derive the same wrong entry from the same correct sentence.
# CORRECTION of the 2026-08-16 Coke Zero entry above (last-confirmation-wins).
# Zak's "it's a case of 12" describes the PHYSICAL carton — but ILG prices the
# line PER BOTTLE: cogs_list shows basis per_unit at $3.69 with case note
# "12x1.25LT" ($2.95/L, sane). The 15000ml entry read "$3.69 buys 15L" — the
# broccolini/camembert shape, latent 12x under-cost. One priced unit = 1.25L.
- id: "ilg:460-1639"
