# water ("Version Two Sparkling - Bottle") is costed per ml. This is the same
# wrong-"can" defect the 2026-08-15 review found on ~30 spirits, recurring on a
# soft drink — the Back Office seed writes "can" for anything it cannot size.
#
# "can" is also factually wrong, and our OWN invoices say so: ILG sells us this
# as code 450-1293 "S.PELLEGRINO SPARKLING WATER" with raw_uom "24x500ML" — a
