# --- Sapore Roasted Red Peppers Strips, A12 tin (2026-08-16) ---------------
# Flagged by the daily product review: 1 "ea" at $14.00 with needs_pack_review
# FALSE, so a recipe could only ever book a whole tin and 100 g of pepper strips
# could not be costed at all. The weight is NOT on the Gulli invoice (the line
# states no UOM), so it was NOT guessed — it comes from the manufacturer's own
# spec sheet, published on Gulli's catalogue page for this exact supplier code:
#   shop.gullifood.com.au -> sappepstripa12-uc3 -> Documents ->
#   "Specifications for Red Roasted Peppers Whole & Strips.pdf", page 2,
#   headed "ROASTED PEPPERS RED strips":
#       Packing Type   A 12 (5/1) TIN BOX
#       NET WEIGHT     4200 G
#       DRAINED WEIGHT 2500 G
# (Page 1 is the WHOLE peppers spec with identical figures; page 2 is the strips
# one, which is the product we buy. Same catalogue page also states "Outer
# Quantity CTN (3)", which corroborates the "-UC3" in the supplier code.)
#
# DRAINED (2500 g) is the divisor, not net (4200 g), for two reasons:
#   * A recipe uses the peppers, not the brine. Drained weight is what reaches
#     the plate, so it is what the dish should be charged for.
#   * It is also the conservative direction. Costing on the 4200 g net weight
#     would make the peppers read 1.68x cheaper per gram than they are, and
#     CLAUDE.md is explicit that the errors which flatter GP are the dangerous
#     ones. If this is wrong it is wrong toward review, not toward a rosy margin.
