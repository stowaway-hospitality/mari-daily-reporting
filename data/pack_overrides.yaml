- id: "lightspeed:20744468"           # Plantation 3 Stars White Rum, Harry Gatos' copy
  pack_qty: 700
  pack_unit: ml
  # Back Office holds this one bottle three times, and all three carry the SAME
  # price — $60.33 (20445856, portal), $60.83 (20487946, Stowaway) and $60.83
  # (20744468, Harry Gatos). Two of them say 700 ML. This one says 4500 ML, which
  # is not a size Plantation 3 Stars is sold in, and an identical price against a
  # 6.4x larger pack is what makes it read $0.013518/ml where its own twins read
