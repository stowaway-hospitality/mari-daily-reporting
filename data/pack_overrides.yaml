  # margins, so the box price is not obliged to be an exact multiple of the
  # bunch price. At 12 the box works out $36.00/12 = $3.00 a bunch against
  # $3.17 loose — buying the box saves ~5%, which is the normal direction. At
  # 10 it was $3.60 a bunch, i.e. DEARER than buying them loose, which is the
