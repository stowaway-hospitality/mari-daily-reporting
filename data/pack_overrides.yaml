# NO OVERRIDE FOR lightspeed:22995343 (Herb Chives [Market]) — AND THIS IS THE ENTRY.
#
# I wrote one, shipped it, watched it break the number, and took it out. The
# reasoning is recorded so the next person does not re-derive the same wrong fix,
# because the evidence for it looks airtight right up until it isn't.
#
# THE APPARENT PROOF. Fresh Fruit Team bill chives under two codes and across 17
# paired invoices the ratio has a median of EXACTLY 6.00x — eight consecutive
# same-or-next-day pairs at 6.00x to the cent ($1.65 vs $9.90). Read that as a pack
# count and "the Market pack is six bunches" is irresistible.
#
# WHY IT IS WRONG, TWICE OVER.
#
# 1. ZAK ALREADY ANSWERED THIS. Line 185 of this file: "Fresh Fruit Team market
#    herbs — sold by the bunch (Zak confirmed 2026-07-26)", fresh-fruit-team:HCMB pack_qty 1
#    pack_unit bunch. A market bunch is not a pack of six retail bunches, it is one
#    bunch about six times the size — which is exactly why it costs 6x. The unit is
#    right and the price is right; they are two different bunches. A ratio is not
#    evidence of a pack count when a size difference explains it just as well, and
#    the owner's confirmation about what arrives in the van outranks my arithmetic.
#
# 2. THE DIVISOR WOULD HAVE HIT THE WRONG OBSERVATION ANYWAY. I checked costs.csv
#    first and saw only bo-ingredient-seed-stowaway at $9.9000/can, so dividing by
#    6 looked safe. But 22995343 ALSO carries a recipe-bridge-seed observation at
#    $1.65/ea, and after a rebuild THAT one wins the as-of lookup. So the override
#    divided the BUNCH rate, not the pack: $1.65 / 6 = $0.275 chives, and a fresh
#    feed-line-unit flag appeared quoting $0.0027 lines to prove it. An override
#    cannot see which observation it will land on. Reading the file is not the same
#    as knowing what wins.
#
# WHAT IS ACTUALLY LEFT TO DO: weigh one bunch. The g-denominated lines need a real
# bunch weight, which is what feed-line-unit-chives has been asking for all along.
# No arithmetic available here substitutes for the scales.
#
# (removed block follows, kept only as the record of what was tried)
#   pack_qty: 6 / pack_unit: ea
  # The chives "two worlds" is not a disagreement, it is two pack sizes, and
  # Fresh Fruit Team's own invoices state the ratio as an exact identity.
  # They bill chives under two codes:
  #
  #   HCBCH  "Herb Chives"  qty 6 @ $1.65 = $9.90   (INB00099947, INB00101527,
  #                                                  INB00110184 — same $9.90
  #                                                  every time)
  #   HCMB   "Chives" Market qty 1 @ $9.90 = $9.90  (INB00099534, INB00099936,
  #                                                  INB00101295)
  #
  # $1.65 x 6 = $9.90 to the cent, on three separate invoices. The MARKET pack
  # is six bunches. Back Office holds this product as Unit "unit", DefaultSize
  # 1, CostPriceIncTax $9.9000 — the pack price with no pack, which is why it
  # surfaced as "$9.90 per can" against a $2.75 bunch.
  #
  # SAFE TO DIVIDE: the stored observation is the $9.90 PACK price (checked in
