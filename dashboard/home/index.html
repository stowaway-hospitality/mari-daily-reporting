<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stowaway Hospitality Group</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/_shared/tokens.css?v=20260719b">
<!--
  The app home. Sign in ONCE here (Supabase), then pick a tool. This is the
  front door: login lives at /, not on any one tool page. Each tool (/sales/,
  /recipes/) shares this session — one login for everything.
-->
<style>
  .home{max-width:920px;margin:0 auto;padding:40px 24px}
  .hero{margin-bottom:30px}
  .hero h1{font-size:30px;letter-spacing:-.02em}
  .hero .who{color:var(--ink-soft);font-size:14px;margin-top:6px}
  .hero .who b{color:var(--ink);font-weight:600}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .tile{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--paper);
    border:1px solid var(--line);border-radius:14px;padding:22px;border-top:4px solid var(--grey);
    box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s,border-color .12s;min-height:118px}
  .tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .tile.stow{border-top-color:var(--stow)} .tile.hg{border-top-color:var(--hg)}
  .tile.mari{border-top-color:var(--mari)}
  .tile h2{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:0 0 7px}
  .tile p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.5}
  .tile .locked{font-size:11.5px;color:var(--amber);margin-top:auto;padding-top:10px}
  .arrow{margin-top:auto;padding-top:12px;font-family:'Space Grotesk',sans-serif;font-size:12px;
    font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
  .app-header{border-bottom:1px solid var(--line);background:var(--paper)}
  .app-header-inner{max-width:920px;margin:0 auto;padding:14px 24px;display:flex;
    align-items:center;justify-content:space-between;gap:16px}
  .brand-row{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
  .brand-row img{height:34px;width:auto;display:block}
  .group-brand{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;
    letter-spacing:-.01em;color:var(--ink)}
  .app-header .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);margin:0}
  .app-header .who a{color:var(--ink);text-decoration:none}
  .app-header .who a:hover{text-decoration:underline}
  .homelinks{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}
  .homelinks a{font-size:13px;color:var(--ink-soft);text-decoration:none;
    border-bottom:1px solid var(--line);padding-bottom:2px}
  .homelinks a:hover{color:var(--ink)}
</style>
</head>
<body>
<div id="gate"></div>
<div id="app" style="display:none">
  <header class="app-header"><div class="app-header-inner">
    <a class="brand-row" href="/"><img src="/logo_512.png" alt=""><span class="group-brand">Stowaway Hospitality Group</span></a>
    <div class="who"><span id="whotop"></span><a href="#" id="signout">sign out</a></div>
  </div></header>
  <div class="home">
    <div class="hero">
      <h1>Welcome back</h1>
      <div class="who" id="who"></div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div id="links" class="homelinks"></div>
    <div id="health" style="margin-top:26px"></div>
  </div>
</div>

<script type="module">
import { Auth } from '/_shared/auth.js';

const TOOLS = [
  { href: '/sales/',   cls: 'stow', title: 'Daily Reporting',
    desc: 'Sales, wages, COGS and margins across all three venues.',
    roles: null },   // everyone signed in
  // ONE tile per module. Recipe Book, Cost book flags, Price Comparison and
  // Invoices were four tiles pointing INTO what is now a single six-tab module
  // (see _shared/recipe_tabs.js), so the hub advertised a split that no longer
  // exists and made the app look like eight tools instead of three. Their tabs
  // are one click away inside Recipes; Invoices stays admin-gated there and on
  // its own page. The old URLs all still resolve — a URL is a contract.
  { href: '/recipes/', cls: 'hg',   title: 'Recipes',
    desc: 'The cost book: every dish and drink costed off our own invoice-fed prices, '
        + 'what still needs a human answer, supplier price comparison, and the invoice queue.',
    roles: null },   // everyone signed in; the admin-only tabs gate themselves
  { href: '/bookings/', cls: 'stow', title: 'Bookings',
    desc: 'Event bookings on the seating engine: day view, edits, runsheets.',
    roles: null },   // everyone signed in
  // The me&u replacement, venue side. Guests scan and pay on the ordering
  // service; THIS is where the venue sees those orders land — the live queue
  // (while the Lightspeed till link is dry-run, this page IS the docket) and
  // the 86 board that pulls an item off the guest menu mid-service. Same
  // pattern as Bookings: this hub's login opens the page, the service token
  // arrives silently via app_config.
  { href: '/qr/', cls: 'stow', title: 'QR Orders',
    desc: 'Table ordering, venue side: the live order queue for the pass, '
        + 'and the 86 board that pulls sold-out items off the guest menu.',
    roles: null },   // everyone signed in — the pass, the bar, the office
  // The other half of the same engine. A booking holds tables on a day that is
  // already agreed; a FUNCTION is the weeks before that — what we still do not
  // know, what it costs, and whether the deposit can be taken yet. It lived at
  // /admin/functions on the Render service, where nobody works and where it
  // asked for the service token in a box. Same behaviour, on this hub's login.
  { href: '/functions/', cls: 'stow', title: 'Functions',
    desc: 'Function enquiries end to end: what each one is still missing, the '
        + 'minimum spend and why, package totals, and the $100 deposit.',
    roles: null },   // everyone signed in
];

// Not a module — a small admin link, kept off the tile grid so the hub reads as
// three things to open, not four.
const LINKS = [
  { href: '/admin/', title: 'Team', desc: 'Invite people and set what they can do.',
    roles: ['admin'] },
];

Auth.gate(document.getElementById('gate'), {
  roles: null,               // any signed-in user reaches the home
  onOk: (user) => {
    document.getElementById('app').style.display = '';
    document.getElementById('whotop').innerHTML = `<strong>${user.name}</strong>`;
    document.getElementById('who').innerHTML =
      `Signed in as <b>${user.name}</b>` + (user.role ? ` · ${user.role}` : ' · no role yet');
    document.getElementById('signout').onclick = async (e) => {
      e.preventDefault(); await Auth.logout(); location.reload();
    };
    // Only render tiles this person can actually open — the rest are hidden,
    // not shown locked. (Direct-URL access is still gated per page.)
    const tiles = TOOLS
      .filter(t => !t.roles || (user.role && t.roles.includes(user.role)))
      .map(t => `<a class="tile ${t.cls}" href="${t.href}">
        <h2>${t.title}</h2><p>${t.desc}</p>
        <div class="arrow">Open →</div>
      </a>`).join('');
    document.getElementById('tiles').innerHTML = tiles;
    const links = LINKS
      .filter(t => !t.roles || (user.role && t.roles.includes(user.role)))
      .map(t => `<a class="homelink" href="${t.href}">${t.title}</a>`).join('');
    const lw = document.getElementById('links');
    if (lw) { lw.innerHTML = links; lw.style.display = links ? '' : 'none'; }
    if (user.role === 'admin') renderHealth();
  },
});

// System-status panel (admin only). Reads the snapshot the monitor writes each
// poller cycle and shows, in plain English, what is wrong and what to do. Two
// signals: the reported status AND the snapshot's own age - if it is stale, the
// job that writes it has stopped, which is the whole point. See TROUBLESHOOTING.md.
async function renderHealth(){
  const el = document.getElementById('health');
  let h;
  try { h = await fetch('/data/system_health.json', {cache:'no-store'}).then(r=>r.json()); }
  catch { return; }                       // no snapshot yet - say nothing
  const ageMin = (Date.now() - new Date(h.generated).getTime()) / 60000;
  const checked = new Date(h.generated).toLocaleString('en-AU',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});
  const C = s => s==='down'?'var(--red)':s==='warn'?'var(--amber)':'var(--green)';
  const ICON = s => s==='down'?'⚠':s==='warn'?'•':'✓';

  const items = [];
  if (ageMin > 1800){                     // >30h with no refresh -> the publish chain stopped
    items.push({status:'down', name:'Monitoring', age:`${Math.round(ageMin/60)}h`,
      meaning:'The status snapshot is republished through the day; it has not refreshed in over a day.',
      action:'Check the office Mac is on and awake and that the daily pipeline ran - it resumes on its own once it is. Still stale after a day? Tell Zak.',
      selfheal:'Refreshes on the next pipeline run.'});
  }
  (h.checks||[]).forEach(c=>{
    if (c.status==='down' || c.status==='warn'){
      items.push({status:c.status, name:c.name,
        age: c.age!=null ? `${c.age}${c.unit} ago` : '',
        meaning: c.meaning || c.detail || '', action: c.action || '', selfheal: c.selfheal || ''});
    }
  });

  if (!items.length){                     // all green
    el.innerHTML = `<div style="display:flex;align-items:center;gap:10px;border:1px solid var(--line);
        border-left:4px solid var(--green);border-radius:10px;background:var(--paper);
        padding:11px 15px;margin-bottom:18px;font-size:13px">
      <span style="color:var(--green);font-weight:700;font-size:15px">✓</span>
      <span><b>System status</b> - all automation running normally.</span>
      <span style="margin-left:auto;color:var(--ink-soft);font-size:11px">checked ${checked}</span>
    </div>`;
    return;
  }

  const worst = items.some(i=>i.status==='down') ? 'down' : 'warn';
  const rows = items.map(i=>`
    <div style="border:1px solid var(--line);border-left:3px solid ${C(i.status)};
        border-radius:8px;background:var(--paper);padding:9px 12px;margin-top:8px">
      <div style="display:flex;gap:8px;align-items:baseline">
        <span style="color:${C(i.status)};font-weight:700">${ICON(i.status)}</span>
        <b style="font-size:13.5px">${i.name}</b>
        ${i.age?`<span style="color:var(--ink-soft);font-size:11px">${i.age}</span>`:''}
      </div>
      ${i.meaning?`<div style="font-size:12.5px;color:var(--ink-soft);margin:3px 0 0 20px">${i.meaning}</div>`:''}
      ${i.action?`<div style="font-size:12.5px;margin:5px 0 0 20px"><b>Do:</b> ${i.action}</div>`:''}
      ${i.selfheal?`<div style="font-size:11.5px;color:var(--ink-soft);margin:3px 0 0 20px">Self-heals: ${i.selfheal}</div>`:''}
    </div>`).join('');
  el.innerHTML = `<div style="border:1px solid var(--line);border-top:4px solid ${C(worst)};
      border-radius:12px;background:var(--paper);padding:13px 15px;margin-bottom:18px;box-shadow:var(--shadow)">
    <div style="display:flex;align-items:center;gap:9px">
      <span style="color:${C(worst)};font-weight:700;font-size:16px">${ICON(worst)}</span>
      <b style="font-size:14px">System status - ${worst==='down'?'needs attention':'minor issues'}</b>
      <span style="margin-left:auto;color:var(--ink-soft);font-size:11px">checked ${checked}</span>
    </div>
    <div style="font-size:11.5px;color:var(--ink-soft);margin-top:3px">
      Not sure what to do? Ask Claude, or open TROUBLESHOOTING.md.</div>
    ${rows}
  </div>`;
}

</script>
</body>
</html>
