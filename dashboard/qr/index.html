<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Orders — Stowaway Hospitality Group</title>
<link rel="stylesheet" href="/_shared/tokens.css?v=20260820a">
<!-- QR Orders — shell only; ALL logic lives in qr.js (arch_guard convention).
     Bump the ?v= on qr.js whenever it changes.

     The manage.meandu.app recreation, on our hub: left sidebar (Your Menu /
     Orders / Venue), the green accepting-orders dot up top, me&u's Menu Items
     layout — category rows with Edit buttons, drill into sections and items.
     Same wiring as ever: Supabase gate opens the page, the service bearer
     token (Auth.bookingToken()) is the real auth on every call. -->
<style>
  /* me&u's own palette: warm off-white canvas, white cards, deep green */
  :root{ --mu-green:#1d5b4a; --mu-green-soft:#e7efec; --mu-canvas:#faf9f6;
         --mu-card:#ffffff; --mu-line:#e6e2da; --mu-ink:#191919; --mu-sub:#6f6a62;
         --mu-red:#a3352c; --mu-red-soft:#f8e9e7; --mu-amber:#8a6d1d; --mu-amber-soft:#f7efd8; }
  @media (prefers-color-scheme: dark){
    :root{ --mu-green:#4fa183; --mu-green-soft:#173129; --mu-canvas:#141414;
           --mu-card:#1e1d1b; --mu-line:#37342f; --mu-ink:#f2efe9; --mu-sub:#a09a90;
           --mu-red:#e08279; --mu-red-soft:#3a1f1c; --mu-amber:#d9b45c; --mu-amber-soft:#3a311c; }
  }
  .qr-app{ background:var(--mu-canvas); min-height:calc(100vh - 60px); }
  .layout{ display:flex; max-width:1240px; margin:0 auto; align-items:flex-start; }

  /* sidebar, the me&u nav */
  aside{ width:216px; flex:0 0 216px; padding:22px 10px 40px 18px; position:sticky; top:0; }
  aside .navhead{ font-size:11px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--mu-sub); margin:18px 10px 6px; font-weight:600; }
  aside button{ display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    padding:9px 12px; font:inherit; font-size:14px; color:var(--mu-ink); background:none;
    border:none; border-radius:9px; cursor:pointer; }
  aside button.sel{ background:var(--mu-green-soft); color:var(--mu-green); font-weight:600; }
  aside button .cnt{ margin-left:auto; font-size:11.5px; background:var(--mu-red);
    color:#fff; border-radius:99px; padding:1px 7px; font-weight:600; }

  main.mu{ flex:1; min-width:0; padding:18px 26px 60px; }

  /* topbar: the green dot */
  .mu-top{ display:flex; align-items:center; gap:10px; padding:10px 0 4px;
    border-bottom:1px solid var(--mu-line); margin-bottom:14px; }
  .dotwrap{ display:flex; align-items:center; gap:8px; font-size:14px; cursor:pointer;
    padding:6px 12px; border-radius:99px; border:1px solid var(--mu-line);
    background:var(--mu-card); user-select:none; }
  .dot{ width:10px; height:10px; border-radius:99px; background:#2fa36b;
    box-shadow:0 0 0 3px rgba(47,163,107,.18); }
  .dot.off{ background:var(--mu-red); box-shadow:0 0 0 3px rgba(163,53,44,.15); }
  .mu-top .writer{ margin-left:auto; font-size:12.5px; color:var(--mu-sub); }

  h1.mu{ font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:600;
    margin:6px 0 14px; color:var(--mu-ink); }
  .mu-sub{ font-size:13px; color:var(--mu-sub); margin:-8px 0 16px; line-height:1.5; }

  .mu-card{ background:var(--mu-card); border:1px solid var(--mu-line);
    border-radius:14px; padding:6px 18px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .mu-card.pad{ padding:16px 18px; }

  .mu-search{ width:100%; box-sizing:border-box; padding:12px 14px; font:inherit;
    font-size:14.5px; border:1px solid var(--mu-line); border-radius:10px;
    background:var(--mu-card); color:var(--mu-ink); margin:0 0 14px; }

  /* me&u's category / item rows */
  .mrow{ display:flex; align-items:center; gap:12px; padding:14px 2px;
    border-bottom:1px solid var(--mu-line); }
  .mrow:last-child{ border-bottom:none; }
  .mrow .thumb{ width:44px; height:44px; border-radius:8px; background:var(--mu-green-soft);
    display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif;
    font-weight:600; color:var(--mu-green); font-size:15px; flex:0 0 44px; object-fit:cover; }
  img.thumb{ background:none; }
  .mrow .ttl{ font-weight:600; font-size:15px; color:var(--mu-ink); }
  .mrow .ttl .tag{ font-weight:400; font-size:12px; color:var(--mu-sub); margin-left:8px; }
  .mrow .meta{ font-size:12.5px; color:var(--mu-sub); margin-top:2px; }
  .mrow .right{ margin-left:auto; display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .chip{ font-size:11.5px; padding:3px 10px; border-radius:99px; border:1px solid var(--mu-line);
    color:var(--mu-sub); background:var(--mu-card); white-space:nowrap; }
  .chip.sched{ border-color:var(--mu-amber); color:var(--mu-amber); background:var(--mu-amber-soft); }
  .chip.hid{ border-color:var(--mu-red); color:var(--mu-red); background:var(--mu-red-soft); }
  .chip.ok{ border-color:var(--mu-green); color:var(--mu-green); background:var(--mu-green-soft); }
  .btn{ font:inherit; font-size:13.5px; cursor:pointer; border-radius:9px;
    padding:8px 18px; border:1px solid var(--mu-line); background:var(--mu-card);
    color:var(--mu-ink); }
  .btn.green{ background:var(--mu-green); border-color:var(--mu-green); color:#fff; font-weight:600; }
  .btn.danger{ border-color:var(--mu-red); color:var(--mu-red); }
  .btn.sm{ padding:6px 13px; font-size:12.5px; }
  .crumb{ font-size:13.5px; color:var(--mu-sub); margin-bottom:10px; }
  .crumb a{ color:var(--mu-green); cursor:pointer; text-decoration:none; font-weight:600; }

  .sechead{ display:flex; align-items:center; gap:10px; padding:16px 2px 6px;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;
    letter-spacing:.02em; color:var(--mu-ink); border-bottom:2px solid var(--mu-ink);
    margin-bottom:2px; }
  .sechead .desc{ font-family:Inter,sans-serif; font-weight:400; font-size:12.5px;
    color:var(--mu-sub); }
  .sechead .right{ margin-left:auto; display:flex; gap:6px; }

  /* forms (item editor, category editor, settings) */
  .fform{ padding:12px 2px 16px; border-bottom:1px solid var(--mu-line); }
  .fform label{ display:block; font-size:11.5px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--mu-sub); margin:12px 0 4px; }
  .fform input[type=text], .fform textarea, .fform select{ width:100%; box-sizing:border-box;
    padding:10px 11px; font:inherit; font-size:14px; border:1px solid var(--mu-line);
    border-radius:9px; background:var(--mu-card); color:var(--mu-ink); }
  .fform textarea{ height:58px; resize:vertical; }
  .row2{ display:flex; gap:12px; } .row2>div{ flex:1; }
  .btns{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .msg{ font-size:13px; color:var(--mu-red); margin-top:8px; }
  .empty{ padding:44px 20px; text-align:center; font-style:italic; color:var(--mu-sub); }
  .daysel{ display:flex; gap:6px; flex-wrap:wrap; }
  .daysel label{ display:flex; gap:5px; align-items:center; font-size:13px;
    text-transform:none; letter-spacing:0; color:var(--mu-ink); margin:0;
    border:1px solid var(--mu-line); border-radius:8px; padding:6px 9px; cursor:pointer; }

  /* queue cards keep their kitchen-legibility */
  .order{ padding:14px 2px; border-bottom:1px solid var(--mu-line); }
  .order .top{ display:flex; align-items:baseline; gap:12px; }
  .order .tbl{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:600; }
  .order .meta{ color:var(--mu-sub); font-size:13px; }
  .order.fresh{ animation:qrflash 1.2s ease-in-out infinite alternate; }
  @keyframes qrflash{ from{ background:var(--mu-green-soft);} to{ background:transparent;} }
  .lines{ margin-top:8px; }
  .ln{ display:flex; gap:12px; padding:7px 0; border-bottom:1px dashed var(--mu-line); font-size:15px; }
  .ln .q{ min-width:30px; font-weight:600; }
  .ln .mods{ font-size:13px; color:var(--mu-sub); margin-top:2px; }
  .ln .note{ font-size:13px; color:var(--mu-amber); margin-top:2px; font-style:italic; }
  .order .err{ margin-top:8px; font-size:13px; color:var(--mu-red); }
  .acts{ display:flex; gap:10px; margin-top:12px; }
  .acts .btn{ flex:1; }

  table.simple{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.simple th{ text-align:left; font-size:11.5px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--mu-sub); padding:8px; border-bottom:1px solid var(--mu-line); }
  table.simple td{ padding:8px; border-bottom:1px solid var(--mu-line); color:var(--mu-ink); }
  table.simple td.r, table.simple th.r{ text-align:right; }
  .statgrid{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .stat{ flex:1; min-width:150px; }
  .stat .n{ font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:600; color:var(--mu-ink); }
  .stat .l{ font-size:12px; color:var(--mu-sub); text-transform:uppercase; letter-spacing:.05em; }

  #tokenbox{ display:none; margin-bottom:14px; }
  #tokenbox input{ width:100%; box-sizing:border-box; padding:10px 12px; font:inherit;
    font-size:14px; border:1px solid var(--mu-line); border-radius:9px; margin:8px 0; }

  @media (max-width:760px){
    .layout{ flex-direction:column; }
    aside{ width:auto; flex:none; position:static; display:flex; overflow-x:auto;
      gap:4px; padding:10px 14px; }
    aside .navhead{ display:none; }
    aside button{ white-space:nowrap; width:auto; }
    main.mu{ padding:6px 16px 60px; }
  }
</style>
</head>
<body>

<div id="gate"></div>

<div id="app" style="display:none">
  <header class="app-header"><div class="app-header-inner">
    <a class="brand-row" href="/"><img src="/logo_512.png" alt=""><span class="group-brand">Stowaway Hospitality Group</span></a>
    <div class="who"><span id="whotop"></span><a href="/">home</a><a href="#" id="signout">sign out</a></div>
  </div></header>

  <div class="qr-app"><div class="layout">
    <aside>
      <div class="navhead">Your menu</div>
      <button id="navMenu" class="sel">Menu items</button>
      <button id="navMods">Modifiers</button>
      <div class="navhead">Orders</div>
      <button id="navQueue">Live queue <span class="cnt" id="qcount" style="display:none"></span></button>
      <button id="nav86">86 board</button>
      <button id="navHist">History</button>
      <div class="navhead">Venue</div>
      <button id="navSet">Settings</button>
      <button id="navIns">Insights</button>
    </aside>

    <main class="mu">
      <div class="mu-top">
        <div class="dotwrap" id="acceptWrap" title="Tap to pause or resume ordering">
          <span class="dot" id="acceptDot"></span><span id="acceptLbl">Accepting orders</span>
        </div>
        <span class="writer" id="writerPill"></span>
      </div>

      <div class="mu-card pad" id="tokenbox">
        <strong>Service token needed</strong>
        <p style="margin:6px 0 0;font-size:13.5px;color:var(--mu-sub)">
          The ordering service token isn't in app config yet — paste it once for
          this device (Render → stowaway-bookings → Environment → STOWAWAY_ADMIN_TOKEN).</p>
        <input id="tok" type="password" autocomplete="off" placeholder="service token">
        <button class="btn green" id="tokgo">Save</button>
      </div>

      <section id="vMenu"></section>
      <section id="vMods" style="display:none"></section>
      <section id="vQueue" style="display:none"></section>
      <section id="v86" style="display:none"></section>
      <section id="vHist" style="display:none"></section>
      <section id="vSet" style="display:none"></section>
      <section id="vIns" style="display:none"></section>
    </main>
  </div></div>
</div>

<script type="module" src="./qr.js?v=20260820d"></script>
</body>
</html>
