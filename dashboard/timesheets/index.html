<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timesheet triage · Stowaway Hospitality Group</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/_shared/tokens.css?v=20260719b">
<!--
  Deputy timesheet triage — REPORT ONLY. Reads data/deputy_triage.json (written
  each morning by the Deputy Triage GitHub Action). Shows what the automation
  WOULD auto-approve vs what it parks for a human, with the reason. Nothing here
  writes to Deputy or approves anything — it is a morning worklist for Kris/Zak.
-->
<style>
  .wrap{max-width:860px}
  .sub{color:var(--ink-soft);font-size:13px;margin:-4px 0 16px;line-height:1.5}
  .banner{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;
    background:var(--paper);padding:11px 15px;margin-bottom:14px;font-size:13px}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px}
  .chip{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;background:var(--paper)}
  .chip b{font-size:15px;font-variant-numeric:tabular-nums}
  .chip.appr b{color:var(--green)} .chip.park b{color:var(--amber)}
  h2.sec{font-family:'Space Grotesk',sans-serif;font-size:15px;margin:24px 0 8px}
  h2.sec .n{font-size:11px;color:var(--ink-soft);font-weight:400}
  .row{display:flex;align-items:baseline;gap:12px;border:1px solid var(--line);border-left:4px solid var(--line);
    border-radius:10px;background:var(--paper);padding:10px 14px;margin-bottom:8px;font-size:13.5px;flex-wrap:wrap}
  .row.risk{border-left-color:var(--red)} .row.fix{border-left-color:var(--amber)} .row.ok{border-left-color:var(--green)}
  .row .emp{font-weight:600;min-width:150px}
  .row .area{color:var(--ink-soft);font-size:12px;min-width:110px}
  .row .why{color:var(--ink);flex:1;min-width:220px}
  .row.risk .why{color:var(--red);font-weight:600}
  .muted{color:var(--ink-soft);font-size:12px}
  details{margin-top:6px} details summary{cursor:pointer;font-size:13px;color:var(--ink-soft);margin:8px 0}
  .empty{text-align:center;color:var(--ink-soft);padding:50px 20px}
</style>
</head>
<body>
<div id="gate"></div>
<div id="app" style="display:none">
  <header class="app-header"><div class="app-header-inner">
    <a class="brand-row" href="/"><img src="/logo_512.png" alt=""><span class="group-brand">Stowaway Hospitality Group</span></a>
    <div class="who"><span id="who"></span><a href="/">home</a></div>
  </div></header>
  <div class="wrap">
    <h1>Timesheet triage</h1>
    <p class="sub">Each morning the automation reads the unapproved Deputy timesheets and sorts them:
      what it would safely auto-approve, and what it is leaving for you — with the reason.
      Nothing is approved automatically; this is a worklist.</p>
    <div id="body"><div class="empty">Loading…</div></div>
  </div>
</div>
<script type="module">
import { Auth } from '/_shared/auth.js';
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = t => t ? new Date(t).toLocaleString('en-AU',{weekday:'short',hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'}) : '—';

Auth.gate(document.getElementById('gate'), {
  roles: ['admin'],
  onOk: async (user) => {
    document.getElementById('app').style.display = '';
    document.getElementById('who').textContent = user.name;
    let d;
    try { d = await fetch('/data/deputy_triage.json', {cache:'no-store'}).then(r=>r.json()); }
    catch { document.getElementById('body').innerHTML = '<div class="empty">No triage report yet — the morning run writes it.</div>'; return; }
    render(d);
  },
});

function cls(reason){
  if (/UNDERPAY RISK/i.test(reason)) return 'risk';
  if (/clock\/area correction|reconcile|no break recorded|off the .*grid|unreadable/i.test(reason)) return 'fix';
  return '';
}
function rows(list){
  return list.map(x => `<div class="row ${cls(x.reason)}">
    <span class="emp">${esc(x.employee)}</span>
    <span class="area">${esc(x.area)}</span>
    <span class="why">${esc(x.reason)}</span></div>`).join('');
}
function render(d){
  const c = d.counts || {};
  const ageH = d.generated ? (Date.now()-new Date(d.generated).getTime())/3.6e6 : 999;
  const stale = ageH > 26 ? `<div class="banner">⚠ Last run ${fmt(d.generated)} — may be stale (over a day old).</div>` : '';
  const parked = d.parked || [], appr = d.would_approve || [], skip = d.skipped || [];
  document.getElementById('body').innerHTML = `
    ${stale}
    <div class="banner">Report-only — nothing is approved automatically. This is what the ${fmt(d.generated)} run would do.</div>
    <div class="chips">
      <span class="chip appr"><b>${c.would_approve||0}</b> would auto-approve</span>
      <span class="chip park"><b>${c.park_for_human||0}</b> for you to check</span>
      <span class="chip"><b>${c.skip||0}</b> skipped</span>
    </div>
    <h2 class="sec">For you to check <span class="n">${parked.length}</span></h2>
    ${parked.length ? rows(parked) : '<div class="muted">Nothing parked — all clear.</div>'}
    <details><summary>Would auto-approve (${appr.length})</summary>${appr.length?rows(appr):'<div class="muted">None.</div>'}</details>
    ${skip.length?`<details><summary>Skipped — leave / on shift (${skip.length})</summary>${rows(skip)}</details>`:''}
  `;
}
</script>
</body>
</html>
