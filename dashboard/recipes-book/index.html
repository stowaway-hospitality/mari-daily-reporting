<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe book · Stowaway Hospitality Group</title>
<link rel="canonical" href="/recipes/">
<!--
  THE BOOK MOVED. It is the first tab of /recipes/, which is now one module:
  Book, Build, Prep timer, Flags.

  This stub exists because a URL is a contract. /recipes-book/ is bookmarked, it
  is pasted into chats, and data/cost_book_flags.json's own action text points
  people at these pages. Deleting the directory would have turned all of that
  into a 404 with no clue attached.

  The redirect is computed by /_shared/recipe_tabs.js (pure, and every
  historical URL form is driven through it by scripts/test_recipe_tabs.mjs), so
  '#recipe=Negroni' arriving here still opens the Negroni, and a bare visit
  still lands on the book rather than on the builder.

  The <meta refresh> is the no-JavaScript floor: slower, but it never leaves
  somebody on a blank page.
-->
<meta http-equiv="refresh" content="1;url=/recipes/#book">
<link rel="stylesheet" href="/_shared/tokens.css?v=20260719b">
</head>
<body>
<p style="font:14px/1.6 system-ui;padding:40px 20px;color:var(--ink-soft)">
  The recipe book is now the first tab of <a href="/recipes/#book">/recipes/</a> — taking you there…
</p>
<script type="module">
import { redirectTarget } from '/_shared/recipe_tabs.js';
window.location.replace(redirectTarget(window.location));
</script>
</body>
</html>
